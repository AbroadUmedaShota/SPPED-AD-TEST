<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --surface: #ffffff;
      --line: #d8dde6;
      --text: #17202a;
      --muted: #667085;
      --primary: #0f62fe;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }
    button, select, input, textarea {
      font: inherit;
    }
    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      padding: 8px 12px;
    }
    button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }
    button.ghost {
      background: #f9fafb;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: .6;
    }
    .muted { color: var(--muted); }
    .error { color: var(--danger); }
    .success { color: #067647; }
    .app {
      display: grid;
      grid-template-columns: minmax(320px, 42%) minmax(420px, 1fr);
      min-height: calc(100vh - 58px);
    }
    .list-pane, .detail-pane {
      padding: 16px;
      overflow: auto;
    }
    .list-pane {
      border-right: 1px solid var(--line);
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .status-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 12px;
    }
    .summary-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .summary-chip strong {
      color: var(--text);
      font-size: 13px;
    }
    .summary-chip[aria-selected="true"] {
      border-color: var(--primary);
      background: #edf3ff;
      color: var(--primary);
    }
    .page-navigation, .case-navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }
    .page-navigation span, .case-navigation span {
      font-size: 12px;
      color: var(--muted);
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      padding: 9px 10px;
    }
    textarea {
      min-height: 88px;
      resize: vertical;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    tr[data-id] {
      cursor: pointer;
    }
    tr[data-id].selected {
      background: #edf3ff;
    }
    .row-main {
      display: grid;
      gap: 4px;
    }
    .row-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      min-width: 64px;
      justify-content: center;
      border-radius: 999px;
      background: #eef2f6;
      color: #344054;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .detail {
      display: grid;
      gap: 14px;
    }
    .section {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }
    .section h2 {
      margin: 0 0 10px;
      font-size: 15px;
      letter-spacing: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 8px 12px;
    }
    .label {
      color: var(--muted);
      font-weight: 700;
    }
    .message {
      white-space: pre-wrap;
      line-height: 1.7;
    }
    .attachments {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .attachment {
      display: grid;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfe;
    }
    .attachment button {
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
    }
    .attachment img,
    .attachment .preview-fallback {
      display: block;
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      border-radius: 6px;
      background: #ffffff;
      border: 1px solid var(--line);
    }
    .attachment .preview-fallback {
      padding: 12px;
      min-height: 96px;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .attachment .preview-button {
      cursor: zoom-in;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .action-row {
      display: grid;
      grid-template-columns: 160px 1fr auto;
      gap: 10px;
      align-items: start;
    }
    .save-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .save-row .status-note {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .save-row a {
      white-space: nowrap;
    }
    .attachment-modal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.72);
      z-index: 20;
    }
    .attachment-modal__dialog {
      width: min(1100px, 100%);
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--line);
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.28);
      overflow: hidden;
    }
    .attachment-modal__toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .attachment-modal__body {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      min-height: 56vh;
      position: relative;
    }
    .attachment-modal__image {
      min-height: 50vh;
      max-height: 76vh;
      width: 100%;
      object-fit: contain;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .attachment-modal__loading {
      position: absolute;
      inset: 14px 60px 14px 60px;
      display: grid;
      place-items: center;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--muted);
      z-index: 1;
    }
    .attachment-modal__meta {
      padding: 0 14px 14px;
    }
    .attachment-modal__nav {
      min-width: 44px;
      height: 44px;
      border-radius: 999px;
    }
    .denied {
      padding: 40px 20px;
      max-width: 720px;
      margin: 0 auto;
    }
    [hidden] { display: none !important; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .list-pane { border-right: 0; border-bottom: 1px solid var(--line); }
      .action-row { grid-template-columns: 1fr; }
      .save-row { flex-direction: column; align-items: stretch; }
      .attachment-modal__body { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
    }
    .mail-queues { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .mail-sync { width: 100%; margin: 0; font-size: 12px; color: var(--muted); }
    .mail-navigation { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .mail-navigation select { flex: 1; min-width: 180px; }
    .mail-body { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 55vh; overflow: auto; padding: 12px; background: #f9fafb; }
    .mail-attachment { margin: 12px 0; padding: 10px; border: 1px solid var(--line); border-radius: 6px; }
    .mail-attachment img { display: block; max-width: 100%; max-height: 60vh; margin-top: 8px; }
    .mail-attachment iframe { display: block; width: 100%; height: 60vh; border: 1px solid var(--line); margin-top: 8px; }
    .mail-attachment pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 60vh; overflow: auto; }
    .mail-review, .mail-resolve { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
    .mail-resolve input { flex: 1; min-width: 200px; }
    .mail-queue-modal { position: fixed; inset: 0; z-index: 1200; background: rgba(16, 24, 40, .5); padding: 24px; overflow: auto; }
    .mail-queue-modal[hidden] { display: none; }
    .mail-queue-dialog { max-width: 1100px; margin: 0 auto; background: var(--surface); border-radius: 8px; padding: 20px; }
    .mail-queue-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    @media (max-width: 600px) { .mail-queue-modal { padding: 8px; } .mail-queue-dialog { padding: 12px; } }
  </style>
</head>

  <script>
    window.CONTACT_VIEWER_INITIAL_ID = <?!= JSON.stringify(initialSubmissionId).replace(/</g, '\\u003c') ?>;
    window.CONTACT_VIEWER_CONTEXT = <?!= JSON.stringify(viewerContext).replace(/</g, '\\u003c') ?>;
  </script>
  <script>
    /* CONTACT_VIEWER_TEST_HELPERS_START */
    function getSubmissionIdFromAppsScriptLocation(location) {
      if (!location) return '';
      if (location.parameter && location.parameter.id) return String(location.parameter.id);
      const values = location.parameters && location.parameters.id;
      return Array.isArray(values) && values.length ? String(values[0] || '') : '';
    }

    function computeQueueCounts(submissions) {
      const counts = {
        total: 0,
        active: 0,
        未対応: 0,
        対応中: 0,
        保留: 0,
        対応済み: 0,
      };
      (submissions || []).forEach((submission) => {
        const status = normalizeViewerHandledStatus(submission && submission.handled_status);
        counts.total += 1;
        if (status === '未対応' || status === '対応中') {
          counts.active += 1;
        }
        if (Object.prototype.hasOwnProperty.call(counts, status)) {
          counts[status] += 1;
        }
      });
      return counts;
    }

    function clampAttachmentIndex(index, attachments) {
      if (!Array.isArray(attachments) || !attachments.length) return -1;
      const numericIndex = Number(index);
      if (!Number.isFinite(numericIndex)) return 0;
      return Math.max(0, Math.min(Math.floor(numericIndex), attachments.length - 1));
    }

    function normalizeViewerHandledStatus(status) {
      const normalized = String(status || '').trim();
      return normalized || '未対応';
    }

    function shouldResetAttachmentModal(previousSubmissionId, nextSubmissionId) {
      return String(previousSubmissionId || '') !== String(nextSubmissionId || '');
    }

    function getAttachmentModalVisibilityState(isVisible) {
      return {
        hidden: !isVisible,
        ariaHidden: isVisible ? null : 'true',
      };
    }

    function buildAttachmentModalViewState(attachments, selectedIndex) {
      const attachmentIndex = clampAttachmentIndex(selectedIndex, attachments);
      if (attachmentIndex < 0) {
        return {
          attachmentIndex,
          hidden: true,
          ariaHidden: 'true',
          loading: false,
          error: '',
          imageSrc: '',
          caption: '',
          prevDisabled: true,
          nextDisabled: true,
        };
      }
      const attachment = attachments[attachmentIndex];
      const loading = !!attachment.previewLoading && !attachment.dataUrl;
      const error = !loading && attachment.previewError && !attachment.dataUrl ? String(attachment.previewError) : '';
      return {
        attachmentIndex,
        hidden: false,
        ariaHidden: null,
        loading,
        error,
        imageSrc: loading || error ? '' : (attachment.dataUrl || ''),
        caption: [attachment.name || attachment.fileId, attachment.originalName ? `元: ${attachment.originalName}` : '', attachment.mimeType || '-']
          .filter(Boolean)
          .join(' / '),
        prevDisabled: attachmentIndex <= 0,
        nextDisabled: attachmentIndex >= attachments.length - 1,
      };
    }

    function buildAttachmentModalClosedState() {
      return {
        attachmentIndex: 0,
        hidden: true,
        ariaHidden: 'true',
      };
    }

    function getDetailAttachmentModalState(_detailState) {
      return buildAttachmentModalClosedState();
    }

    function resetAttachmentModalState() {
      const closedState = getDetailLifecycleResetState('reset');
      state.attachmentIndex = closedState.attachmentIndex;
      state.dirty = closedState.dirty;
      state.attachmentReturnFocus = null;
      setAttachmentLoading(false);
      setAttachmentModalVisibility(!closedState.hidden);
    }

    function getDetailLifecycleResetState(_detailState) {
      return {
        attachmentIndex: 0,
        hidden: true,
        ariaHidden: 'true',
        dirty: false,
      };
    }

    window.__CONTACT_VIEWER_TEST__ = {
      getSubmissionIdFromAppsScriptLocation,
      computeQueueCounts,
      clampAttachmentIndex,
      normalizeViewerHandledStatus,
      shouldResetAttachmentModal,
      getAttachmentModalVisibilityState,
      buildAttachmentModalViewState,
      buildAttachmentModalClosedState,
      getDetailAttachmentModalState,
      getDetailLifecycleResetState,
      resetAttachmentModalState,
    };
    /* CONTACT_VIEWER_TEST_HELPERS_END */

    function getAppsScriptLocation() {
      return new Promise((resolve) => {
        if (window.google && google.script && google.script.url && typeof google.script.url.getLocation === 'function') {
          google.script.url.getLocation(resolve);
          return;
        }
        resolve(null);
      });
    }

    function applyViewerLocationState(location) {
      const submissionId = getSubmissionIdFromAppsScriptLocation(location) || window.CONTACT_VIEWER_INITIAL_ID || '';
      if (submissionId) {
        state.selectedId = submissionId;
        state.initialDetailPending = true;
      }
    }

    function formatElapsedTime(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';
      const diffMs = Date.now() - date.getTime();
      const diffMinutes = Math.max(Math.floor(diffMs / 60000), 0);
      if (diffMinutes < 1) return 'たった今';
      if (diffMinutes < 60) return `${diffMinutes}分前`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}時間前`;
      const diffDays = Math.floor(diffHours / 24);
      return `${diffDays}日前`;
    }

    function buildMailToHref(email, subject) {
      if (!email) return '';
      const params = new URLSearchParams();
      if (subject) params.set('subject', subject);
      return `mailto:${encodeURIComponent(email)}${params.toString() ? `?${params.toString()}` : ''}`;
    }

    const state = {
      selectedId: window.CONTACT_VIEWER_INITIAL_ID || '',
      initialDetailPending: false,
      submissions: [],
      counts: { total: 0, active: 0, 未対応: 0, 対応中: 0, 保留: 0, 対応済み: 0 },
      loading: false,
      saving: false,
      page: { total: 0, from: 0, to: 0, previousPageToken: '', nextPageToken: '' },
      currentPageToken: '',
      appliedStatus: 'active',
      appliedQuery: '',
      listRequestSerial: 0,
      detailRequestSerial: 0,
      saveRequestSerial: 0,
      listError: false,
      listState: 'unobserved',
      savedOutsideFilter: false,
      detail: null,
      detailSnapshot: { handled_status: '', internal_note: '' },
      dirty: false,
      attachmentIndex: 0,
      attachmentRequestSerial: 0,
      attachmentReturnFocus: null,
    };

    const appView = document.getElementById('appView');
    const deniedView = document.getElementById('deniedView');
    const deniedMessage = document.getElementById('deniedMessage');
    const viewerEmail = document.getElementById('viewerEmail');
    const refreshButton = document.getElementById('refreshButton');
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const submissionRows = document.getElementById('submissionRows');
    const detailView = document.getElementById('detailView');
    const statusSummary = document.getElementById('statusSummary');
    const submissionPanel = document.getElementById('submissionPanel');
    const pagePrev = document.getElementById('pagePrev');
    const pageNext = document.getElementById('pageNext');
    const pagePosition = document.getElementById('pagePosition');
    const casePrev = document.getElementById('casePrev');
    const caseNext = document.getElementById('caseNext');
    const casePosition = document.getElementById('casePosition');
    const attachmentModal = document.getElementById('attachmentModal');
    const attachmentModalImage = document.getElementById('attachmentModalImage');
    const attachmentModalCaption = document.getElementById('attachmentModalCaption');
    const attachmentModalCounter = document.getElementById('attachmentModalCounter');
    const attachmentModalPrev = document.getElementById('attachmentModalPrev');
    const attachmentModalNext = document.getElementById('attachmentModalNext');
    const attachmentModalClose = document.getElementById('attachmentModalClose');
    const attachmentModalLoading = document.getElementById('attachmentModalLoading');

    function readAuthProof() {
      try {
        const proof = window.sessionStorage.getItem('speed-ad-contact-oauth-tab-proof-v2') || '';
        return /^[a-f0-9]{64}$/.test(proof) ? proof : '';
      } catch (_error) {
        return '';
      }
    }

    function callServer(name, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((error) => {
            if (String(error.message || error).includes('権限')) showDenied('専用Googleログインから認証し直してください。');
            reject(error);
          })[name](...args, readAuthProof());
      });
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function safeHttpUrl(value) {
      try {
        const url = new URL(String(value || ''));
        return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
      } catch (_error) {
        return '';
      }
    }

    function formatDate(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function setBusy(isBusy) {
      state.loading = isBusy;
      refreshButton.disabled = isBusy || state.saving;
      submissionPanel.setAttribute('aria-busy', String(isBusy));
      setDetailInteractionDisabled(isBusy || state.saving);
      renderNavigation();
    }

    function setDetailInteractionDisabled(disabled) {
      detailView.querySelectorAll('button, input, select, textarea').forEach((control) => { control.disabled = disabled; });
      ['statusSelect', 'internalNote', 'saveStatusButton'].forEach((id) => {
        const control = document.getElementById(id);
        if (control) control.disabled = disabled;
      });
      searchInput.disabled = state.saving;
      statusSummary.querySelectorAll('[role="tab"]').forEach((tab) => { tab.disabled = state.saving; });
    }

    function setAttachmentModalVisibility(isVisible) {
      const visibilityState = getAttachmentModalVisibilityState(isVisible);
      attachmentModal.hidden = visibilityState.hidden;
      if (visibilityState.ariaHidden == null) {
        attachmentModal.removeAttribute('aria-hidden');
      } else {
        attachmentModal.setAttribute('aria-hidden', visibilityState.ariaHidden);
      }
    }

    function renderStatusSummary() {
      const chips = [
        { status: 'all', label: '全件', value: state.counts.total || 0 },
        { status: 'active', label: '対応が必要', value: state.counts.active || 0 },
        { status: '未対応', label: '未対応', value: state.counts['未対応'] || 0 },
        { status: '対応中', label: '対応中', value: state.counts['対応中'] || 0 },
        { status: '保留', label: '保留', value: state.counts['保留'] || 0 },
        { status: '対応済み', label: '対応済み', value: state.counts['対応済み'] || 0 },
      ];
      statusSummary.innerHTML = chips.map((chip, index) => `
        <button type="button" class="summary-chip" role="tab" data-status="${chip.status}" id="status-tab-${index}" aria-controls="submissionPanel" aria-selected="${chip.status === statusFilter.value}" tabindex="${chip.status === statusFilter.value ? 0 : -1}">
          <strong>${escapeHtml(chip.value)}</strong>
          ${escapeHtml(chip.label)}
        </button>
      `).join('');
      submissionPanel.setAttribute('aria-labelledby', `status-tab-${chips.findIndex((chip) => chip.status === statusFilter.value)}`);
      const tabs = Array.from(statusSummary.querySelectorAll('[role="tab"]'));
      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => changeStatusTab(tab.dataset.status));
        tab.addEventListener('keydown', (event) => {
          let nextIndex = index;
          if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
          else if (event.key === 'ArrowLeft') nextIndex = (index + tabs.length - 1) % tabs.length;
          else if (event.key === 'Home') nextIndex = 0;
          else if (event.key === 'End') nextIndex = tabs.length - 1;
          else return;
          event.preventDefault();
          tabs[nextIndex].focus();
          changeStatusTab(tabs[nextIndex].dataset.status);
        });
      });
    }

    async function changeStatusTab(status) {
      if (state.saving || !confirmDiscardChanges()) return;
      statusFilter.value = status;
      state.dirty = false;
      await loadList();
      const selectedTab = Array.from(statusSummary.querySelectorAll('[role="tab"]')).find((tab) => tab.dataset.status === statusFilter.value);
      if (selectedTab) selectedTab.focus();
    }

    function renderNavigation() {
      const index = state.submissions.findIndex((item) => item.submission_id === state.selectedId);
      const busy = state.loading || state.saving || state.listError;
      pagePrev.disabled = busy || !state.page.previousPageToken;
      pageNext.disabled = busy || !state.page.nextPageToken;
      pagePosition.textContent = state.listState === 'loading' ? '読み込み中...' :
        (state.listState === 'failed' ? '一覧を取得できません' :
          (state.listState === 'unobserved' ? '一覧未取得' : (state.page.total ? `${state.page.from}–${state.page.to} / ${state.page.total}件` : '0件')));
      casePrev.disabled = busy || index < 0 || (index === 0 && !state.page.previousPageToken);
      caseNext.disabled = busy || !state.submissions.length || (index === state.submissions.length - 1 && !state.page.nextPageToken);
      casePosition.textContent = index >= 0 ? `${state.page.from + index} / ${state.page.total}件` : (state.detail ? (state.savedOutsideFilter ? '保存済み・現在のタブの対象外' : '表示中の一覧外') : '');
      caseNext.textContent = index < 0 && state.submissions.length ? '一覧の先頭へ →' : '次の問い合わせ →';
    }

    async function moveCase(delta) {
      if (state.loading || state.saving || !confirmDiscardChanges()) return;
      const index = state.submissions.findIndex((item) => item.submission_id === state.selectedId);
      state.dirty = false;
      if (index < 0) {
        await loadList({ selectEdge: 'first' });
        return;
      }
      const nextIndex = index + delta;
      if (nextIndex >= 0 && nextIndex < state.submissions.length) {
        await selectSubmission(state.submissions[nextIndex].submission_id);
      } else {
        const pageToken = delta < 0 ? state.page.previousPageToken : state.page.nextPageToken;
        if (pageToken) await loadList({ pageToken, selectEdge: delta < 0 ? 'last' : 'first' });
      }
    }

    function getStatusFilterLabel(value) {
      const option = Array.from(statusFilter.options).find((item) => item.value === value);
      return option ? option.textContent : value;
    }

    function isDirty() {
      return state.dirty;
    }

    function markDirty() {
      if (!state.detail || state.loading || state.saving) return;
      const statusSelect = document.getElementById('statusSelect');
      const internalNote = document.getElementById('internalNote');
      state.dirty = Boolean(
        statusSelect && internalNote &&
          (statusSelect.value !== state.detailSnapshot.handled_status ||
            internalNote.value !== state.detailSnapshot.internal_note)
      );
      const statusSaveMessage = document.getElementById('statusSaveMessage');
      if (statusSaveMessage && state.dirty) {
        statusSaveMessage.textContent = '未保存の変更があります。';
        statusSaveMessage.classList.remove('success');
        statusSaveMessage.classList.add('muted');
      }
    }

    function confirmDiscardChanges() {
      if (!isDirty()) return true;
      return window.confirm('未保存の変更があります。破棄して別の問い合わせへ移動しますか？');
    }

    function setDetailSnapshot(submission) {
      state.detailSnapshot = {
        handled_status: submission.handled_status || '未対応',
        internal_note: submission.internal_note || '',
      };
      state.dirty = false;
    }

    function renderList() {
      submissionRows.innerHTML = state.submissions.map((item) => `
        <tr data-id="${escapeHtml(item.submission_id)}" class="${item.submission_id === state.selectedId ? 'selected' : ''}">
          <td>
            <div class="row-main">
              <strong>${escapeHtml(formatDate(item.submitted_at))}</strong>
              <span class="muted">${escapeHtml(formatElapsedTime(item.submitted_at))}</span>
            </div>
          </td>
          <td>
            <strong>${escapeHtml(item.subject || 'お問い合わせ')}</strong><br>
            <div class="row-meta">
              <span>${escapeHtml(item.email || '-')}</span>
              <span>${escapeHtml(item.contact_type || '-')}</span>
              <span>${Number(item.attachment_count || 0) > 0 ? `添付 ${escapeHtml(item.attachment_count)}件` : '添付なし'}</span>
            </div>
          </td>
          <td><span class="status">${escapeHtml(item.handled_status || '未対応')}</span></td>
        </tr>
      `).join('');

      submissionRows.querySelectorAll('tr[data-id]').forEach((row) => {
        row.addEventListener('click', () => selectSubmission(row.dataset.id));
      });
      renderNavigation();
    }

    function renderDetailEmpty(message) {
      clearContactMailView('case');
      resetAttachmentModalState();
      state.detail = null;
      state.dirty = false;
      detailView.innerHTML = `<div class="section"><p class="muted">${escapeHtml(message)}</p></div>`;
    }

    function renderDetail(submission) {
      resetAttachmentModalState();
      state.detail = submission;
      state.dirty = false;
      const attachments = submission.attachments || [];
      const replyMailHref = buildMailToHref(submission.email || '', submission.subject || 'お問い合わせ');
      const sourceUrl = safeHttpUrl(submission.source_url);
      const currentStatus = submission.handled_status || '未対応';
      detailView.innerHTML = `
        <section class="section">
          <h2>${escapeHtml(submission.subject || 'お問い合わせ')}</h2>
          <div class="grid">
            <div class="label">受付ID</div><div>${escapeHtml(submission.submission_id)}</div>
            <div class="label">受付日時</div><div>${escapeHtml(formatDate(submission.submitted_at))}</div>
            <div class="label">種別</div><div>${escapeHtml(submission.contact_type || '-')}</div>
            <div class="label">投稿者</div><div>${escapeHtml(submission.name || '-')}</div>
            <div class="label">メール</div><div><a href="mailto:${escapeHtml(submission.email)}">${escapeHtml(submission.email || '-')}</a></div>
            <div class="label">投稿元</div><div>${sourceUrl ? `<a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(sourceUrl)}</a>` : '-'}</div>
            <div class="label">User-Agent</div><div>${escapeHtml(submission.user_agent || '-')}</div>
          </div>
        </section>
        <section class="section">
          <h2>本文</h2>
          <div class="message">${escapeHtml(submission.message || '-')}</div>
        </section>
        <section class="section">
          <h2>対応</h2>
          <div class="actions">
            <div class="quick-actions">
              ${[
                ['対応中', '対応中にする'],
                ['対応済み', '対応済みにする'],
                ['保留', '保留にする'],
              ].map(([status, label]) => `<button type="button" class="ghost quick-status" data-status="${status}">${label}</button>`).join('')}
            </div>
            <div class="action-row">
              <select id="statusSelect">
                ${['未対応', '対応中', '対応済み', '保留'].map((status) => `<option value="${status}" ${status === currentStatus ? 'selected' : ''}>${status}</option>`).join('')}
              </select>
              <textarea id="internalNote" placeholder="内部メモ">${escapeHtml(submission.internal_note || '')}</textarea>
              <button type="button" class="primary" id="saveStatusButton">保存</button>
            </div>
            <div class="save-row">
              <div class="status-note">
                <p class="muted" id="statusSaveMessage"></p>
                <a href="${escapeHtml(replyMailHref)}" target="_blank" rel="noopener noreferrer" id="replyMailLink">返信メールを作成</a>
              </div>
              <span class="muted">最終更新: ${escapeHtml(submission.handled_by || '-')} / ${escapeHtml(formatDate(submission.handled_at))}</span>
            </div>
            <p class="muted">終了日時: ${currentStatus === '対応済み' ? escapeHtml(submission.closed_at ? formatDate(submission.closed_at) : '未確認') : '-'}</p>
          </div>
        </section>
        <section class="section">
          <h2>添付</h2>
          <div class="attachments" id="attachmentList">
            ${attachments.length ? attachments.map((attachment, index) => renderAttachmentShell(attachment, index)).join('') : '<p class="muted">添付はありません。</p>'}
          </div>
        </section>
      `;

      document.getElementById('saveStatusButton').addEventListener('click', () => saveStatus());
      document.querySelectorAll('.quick-status').forEach((button) => {
        button.addEventListener('click', () => saveStatus(button.dataset.status));
      });
      const statusSelect = document.getElementById('statusSelect');
      const internalNote = document.getElementById('internalNote');
      statusSelect.addEventListener('change', markDirty);
      internalNote.addEventListener('input', markDirty);
      document.querySelectorAll('.preview-button').forEach((button) => {
        button.addEventListener('click', () => openAttachmentViewer(Number(button.dataset.attachmentIndex || 0)));
      });
      attachments.forEach((attachment, index) => loadAttachmentPreview(attachment, index));
      setDetailInteractionDisabled(state.loading || state.saving);
      setDetailSnapshot(submission);
      markDirty();
      syncAttachmentModalControls();
      loadContactMailList('case', { caseId: submission.submission_id });
    }

    function renderAttachmentShell(attachment, index) {
      return `
        <div class="attachment" data-file-id="${escapeHtml(attachment.fileId)}">
          <button type="button" class="preview-button" data-attachment-index="${index}">
            <div class="preview muted">読み込み中...</div>
          </button>
          <strong>${escapeHtml(attachment.name || attachment.fileId)}</strong><br>
          <span class="muted">${escapeHtml(attachment.mimeType || '-')} / ${escapeHtml(attachment.size || '-')} bytes</span><br>
          ${attachment.originalName ? `<span class="muted">元: ${escapeHtml(attachment.originalName)}</span><br>` : ''}
          ${safeHttpUrl(attachment.url) ? `<a href="${escapeHtml(safeHttpUrl(attachment.url))}" target="_blank" rel="noopener noreferrer">Driveで開く</a>` : ''}
        </div>
      `;
    }

    async function loadAttachmentPreview(attachment, index) {
      const container = Array.from(detailView.querySelectorAll('[data-file-id]'))
        .find((element) => element.dataset.fileId === attachment.fileId);
      if (!container) return;
      const preview = container.querySelector('.preview');
      attachment.previewLoading = true;
      attachment.previewError = '';
      try {
        const result = await callServer('getAttachmentPreview', state.detail.submission_id, attachment.fileId);
        attachment.dataUrl = result.dataUrl;
        attachment.previewName = result.name;
        attachment.previewLoading = false;
        preview.innerHTML = `<img src="${escapeHtml(result.dataUrl)}" alt="${escapeHtml(result.name)}">`;
      } catch (error) {
        attachment.previewLoading = false;
        attachment.previewError = String(error.message || error);
        preview.textContent = String(error.message || error);
        preview.classList.add('error');
      }
    }

    function renderStatusFilterLabel() {
      statusFilter.title = getStatusFilterLabel(statusFilter.value);
    }

    function validateListResponse(result, selectedId) {
      const invalid = () => { throw new Error('一覧の応答を確認できません。更新してください。'); };
      if (!result || result.ok !== true || !Array.isArray(result.submissions) || !result.page || !result.counts) invalid();
      const page = result.page;
      const isCount = (value) => Number.isInteger(value) && value >= 0;
      if (!Number.isInteger(page.size) || page.size !== 50 || !isCount(page.total) || !isCount(page.from) || !isCount(page.to) ||
          typeof page.previousPageToken !== 'string' || typeof page.nextPageToken !== 'string' ||
          page.previousPageToken.length > 8192 || page.nextPageToken.length > 8192 ||
          result.submissions.length > page.size || (selectedId && typeof result.selectedMatches !== 'boolean')) invalid();
      const countKeys = ['total', 'active', '未対応', '対応中', '保留', '対応済み'];
      if (countKeys.some((key) => !isCount(result.counts[key]) || result.counts[key] > result.counts.total) ||
          result.counts.active !== result.counts['未対応'] + result.counts['対応中'] || page.total > result.counts.total) invalid();
      const ids = result.submissions.map((record) => record && record.submission_id);
      if (ids.some((id) => typeof id !== 'string' || !id.trim()) || new Set(ids).size !== ids.length) invalid();
      if (selectedId && result.selectedMatches === false && (ids.includes(selectedId) || page.from > 1)) invalid();
      if (!page.total) {
        if (ids.length || page.from || page.to || page.previousPageToken || page.nextPageToken) invalid();
      } else if (!ids.length || page.from < 1 || page.to !== page.from + ids.length - 1 || page.to > page.total ||
          Boolean(page.previousPageToken) !== (page.from > 1) || Boolean(page.nextPageToken) !== (page.to < page.total)) invalid();
      return result;
    }

    async function loadList(options = {}) {
      if (state.saving) return;
      if (isDirty() && !confirmDiscardChanges()) {
        searchInput.value = state.appliedQuery;
        statusFilter.value = state.appliedStatus;
        renderStatusSummary();
        return;
      }
      state.dirty = false;
      const requestSerial = ++state.listRequestSerial;
      ++state.detailRequestSerial;
      const query = searchInput.value;
      const status = statusFilter.value;
      const pageToken = options.pageToken || '';
      const selectedId = options.preserveDetail && state.detail ? state.selectedId : '';
      state.listState = 'loading';
      setBusy(true);
      try {
        const result = await callServer('listContactSubmissions', {
          query,
          status,
          pageSize: 50,
          pageToken,
          selectedId,
        });
        if (requestSerial !== state.listRequestSerial) return;
        validateListResponse(result, selectedId);
        state.submissions = result.submissions || [];
        state.listError = false;
        state.listState = 'loaded';
        state.counts = result.counts || state.counts;
        state.page = result.page;
        state.currentPageToken = result.selectedMatches === false ? '' : pageToken;
        state.appliedQuery = query;
        state.appliedStatus = status;
        renderStatusSummary();
        renderStatusFilterLabel();
        renderList();
        if (options.preserveDetail && state.detail) {
          state.savedOutsideFilter = !result.selectedMatches;
          renderNavigation();
        } else if (state.initialDetailPending) {
          state.initialDetailPending = false;
          await selectSubmission(state.selectedId, true);
        } else if (options.selectEdge && state.submissions.length) {
          await selectSubmission(state.submissions[options.selectEdge === 'last' ? state.submissions.length - 1 : 0].submission_id, true);
        } else if (state.selectedId && state.submissions.some((item) => item.submission_id === state.selectedId)) {
          await selectSubmission(state.selectedId, true);
        } else if (state.submissions.length) {
          await selectSubmission(state.submissions[0].submission_id, true);
        } else {
          state.selectedId = '';
          state.detail = null;
          renderDetailEmpty('一致するお問い合わせがありません。');
        }
      } catch (error) {
        if (requestSerial !== state.listRequestSerial) return;
        state.listError = true;
        state.listState = 'failed';
        state.submissions = [];
        renderList();
        resetAttachmentModalState();
        if (!options.preserveDetail || !state.detail) renderDetailEmpty(String(error.message || error));
      } finally {
        if (requestSerial === state.listRequestSerial) setBusy(false);
      }
    }

    async function selectSubmission(id, fromList = false) {
      if (state.saving || (state.loading && !fromList)) return;
      if (id !== state.selectedId && isDirty() && !confirmDiscardChanges()) {
        return;
      }
      const requestSerial = ++state.detailRequestSerial;
      state.savedOutsideFilter = false;
      state.selectedId = id;
      renderList();
      renderDetailEmpty('読み込み中...');
      try {
        const result = await callServer('getContactSubmission', id);
        if (requestSerial !== state.detailRequestSerial) return;
        state.detail = result.submission;
        renderDetail(state.detail);
        setDetailSnapshot(state.detail);
        renderNavigation();
      } catch (error) {
        if (requestSerial !== state.detailRequestSerial) return;
        resetAttachmentModalState();
        renderDetailEmpty(String(error.message || error));
      }
    }

    async function saveStatus(nextStatus) {
      if (state.saving || state.loading) return;
      const saveRequestSerial = ++state.saveRequestSerial;
      const submissionId = state.selectedId;
      const statusSelect = document.getElementById('statusSelect');
      if (nextStatus) {
        statusSelect.value = nextStatus;
      }
      const status = statusSelect.value;
      const note = document.getElementById('internalNote').value;
      const button = document.getElementById('saveStatusButton');
      const message = document.getElementById('statusSaveMessage');
      const requestSerial = ++state.detailRequestSerial;
      state.saving = true;
      refreshButton.disabled = true;
      setDetailInteractionDisabled(true);
      renderNavigation();
      button.disabled = true;
      message.textContent = '保存中...';
      message.classList.remove('error', 'success');
      try {
        const result = await callServer('updateContactSubmissionStatus', submissionId, status, note);
        if (saveRequestSerial !== state.saveRequestSerial || requestSerial !== state.detailRequestSerial || state.selectedId !== submissionId) return;
        state.detail = result.submission;
        renderDetail(state.detail);
        setDetailSnapshot(state.detail);
        state.saving = false;
        await loadList({ pageToken: state.currentPageToken, preserveDetail: true });
        if (saveRequestSerial !== state.saveRequestSerial || state.selectedId !== submissionId || state.loading ||
            !state.detail || state.detail.submission_id !== submissionId) return;
        const successMessage = document.getElementById('statusSaveMessage');
        if (successMessage) {
          successMessage.textContent = '保存しました。';
          successMessage.classList.remove('error');
          successMessage.classList.add('success');
        }
      } catch (error) {
        if (saveRequestSerial !== state.saveRequestSerial || state.selectedId !== submissionId) return;
        message.textContent = String(error.message || error);
        message.classList.add('error');
      } finally {
        if (saveRequestSerial === state.saveRequestSerial) {
          state.saving = false;
          refreshButton.disabled = state.loading;
          setDetailInteractionDisabled(state.loading);
          renderNavigation();
          button.disabled = false;
        }
      }
    }

    function setAttachmentLoading(isLoading, label) {
      attachmentModalLoading.hidden = !isLoading;
      attachmentModalImage.hidden = isLoading;
      if (isLoading) {
        attachmentModalLoading.textContent = label || '読み込み中...';
      }
    }

    async function ensureAttachmentPreviewLoaded(index) {
      const attachments = (state.detail && state.detail.attachments) || [];
      const attachment = attachments[index];
      if (!attachment) return null;
      if (attachment.dataUrl) return attachment;
      if (!attachment.previewPromise) {
        attachment.previewPromise = callServer('getAttachmentPreview', state.detail.submission_id, attachment.fileId)
          .then((result) => {
            attachment.dataUrl = result.dataUrl;
            attachment.previewName = result.name;
            delete attachment.previewError;
            return attachment;
          })
          .finally(() => {
            delete attachment.previewPromise;
          });
      }
      setAttachmentLoading(true, `${attachment.name || attachment.fileId} を読み込み中...`);
      try {
        await attachment.previewPromise;
      } catch (error) {
        attachment.previewError = String(error.message || error);
        setAttachmentLoading(true, attachment.previewError);
        throw error;
      }
      return attachment;
    }

    async function openAttachmentViewer(index) {
      const attachments = (state.detail && state.detail.attachments) || [];
      if (!attachments.length) return;
      state.attachmentReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      state.attachmentIndex = clampAttachmentIndex(index, attachments);
      if (state.attachmentIndex < 0) return;
      const attachment = attachments[state.attachmentIndex];
      const requestSerial = ++state.attachmentRequestSerial;
      attachment.previewLoading = true;
      attachment.previewError = '';
      attachment.previewRequestSerial = requestSerial;
      setAttachmentModalVisibility(true);
      setAttachmentLoading(true, `${attachment.name || attachment.fileId} を読み込み中...`);
      syncAttachmentModalControls();
      attachmentModalClose.focus();
      try {
        await ensureAttachmentPreviewLoaded(state.attachmentIndex);
      } catch (_error) {
        // keep the error visible in the modal
      }
      if (!state.detail || state.detail.attachments[state.attachmentIndex] !== attachment || attachment.previewRequestSerial !== requestSerial) {
        return;
      }
      attachment.previewLoading = false;
      syncAttachmentModalControls();
    }

    function closeAttachmentViewer() {
      setAttachmentModalVisibility(false);
      const target = state.attachmentReturnFocus;
      state.attachmentReturnFocus = null;
      if (target && typeof target.focus === 'function' && document.contains(target)) {
        target.focus();
      }
    }

    function syncAttachmentModalControls() {
      const attachments = (state.detail && state.detail.attachments) || [];
      const viewState = buildAttachmentModalViewState(attachments, state.attachmentIndex);
      state.attachmentIndex = viewState.attachmentIndex;
      if (viewState.attachmentIndex < 0) {
        attachmentModalPrev.disabled = true;
        attachmentModalNext.disabled = true;
        attachmentModalImage.removeAttribute('src');
        attachmentModalImage.hidden = false;
        attachmentModalCaption.textContent = '';
        attachmentModalCounter.textContent = '';
        setAttachmentLoading(false);
        return;
      }
      if (viewState.loading) {
