            const prepared = contactMailResult(await callContactMailSync({ prepareCatalog: true, catalog: progress.catalog }));
            if (serial !== contactMailState.syncSerial) return;
            validateContactMailCatalog(prepared.catalog, progress.catalog, true);
            progress.catalog = prepared.catalog;
            if (contactMailState.syncStopRequested) { element.textContent = '受付ID登録の続行を止めました。続行ボタンから再開できます。'; return; }
          }
          progress.catalogPending = true;
          const catalogResult = contactMailResult(await callContactMailSync({ catalog: progress.catalog }));
          if (serial !== contactMailState.syncSerial) return;
          const catalog = catalogResult.catalog;
          validateContactMailCatalog(catalog, progress.catalog, false);
          progress.catalogPending = false;
          progress.catalog = catalog;
          progress.periodText = `同期対象: ${formatDate(catalog.startAt)}以降`;
          if (!catalog.complete) { element.textContent = `受付IDを照合中: ${catalog.nextPageIndex} / ${catalog.pageCount}ページ。続行ボタンで次へ進めます。`; return; }
          progress.executionId = window.crypto.randomUUID();
          progress.mode = sync.historyAvailable && sync.state !== 'needs_full_sync' ? 'history' : 'full';
        }
        for (let batch = 1; batch <= 20; batch++) {
          if (contactMailState.syncStopRequested) {
            element.textContent = '同期の続行を止めました。続行ボタンから再開できます。';
            break;
          }
          if (!viewerContext.allowed || viewerContext.authMode !== 'domain') return;
          progress.requestId = progress.requestId || window.crypto.randomUUID();
          progress.requestPayload = progress.requestPayload || {
            executionId: progress.executionId,
            ...(!progress.started ? { mode: progress.mode, catalogSnapshotId: progress.catalog.snapshotId, catalogDigest: progress.catalog.digest, catalogStartAt: progress.catalog.startAt } : {}), ...((contactMailState.sync || {}).state === 'failed' ? { resume: true } : {}),
          };
          const confirming = progress.requestPending === true;
          progress.requestPending = true;
          observationSerial = contactMailState.syncObservationSerial;
          const response = await callContactMailSync({
            ...progress.requestPayload, requestId: progress.requestId, ...(confirming ? { confirmOnly: true } : {}),
          });
          if (serial !== contactMailState.syncSerial) return;
          if (!confirming && response && response.ok === false && response.error && response.error.code === 'MAIL_SYNC_NOT_DISPATCHED' && ['MAIL_CATALOG_CHANGED', 'MAIL_NOT_CONFIGURED', 'MAIL_SERVICE_AUTH', 'MAIL_PERIOD_REQUIRED', 'MAIL_CATALOG_INVALID'].includes(response.error.cause) &&
              response.dispatch && response.dispatch.sent === false && response.dispatch.operation === 'advanceSync' && response.dispatch.requestId === progress.requestId && response.dispatch.executionId === progress.executionId) {
            progress.requestPending = false;
            const latestSyncText = observationSerial !== contactMailState.syncObservationSerial ? `${renderContactMailSync(contactMailState.sync)} ` : '';
            if (['MAIL_CATALOG_CHANGED', 'MAIL_CATALOG_INVALID'].includes(response.error.cause)) {
              contactMailState.syncProgress = null;
              element.textContent = `${latestSyncText}受付データが変わったか確認できないため、GASの事前確認で停止しました。この同期要求はCloudへ送信していません。メール同期ボタンで現在のSheetから計画を作り直してください。`;
            } else element.textContent = `${latestSyncText}${contactMailErrorText(response.error.cause)} この同期要求はCloudへ送信していません。設定・認証の回復後、続行ボタンから同じ要求を明示的に送信できます。`;
            break;
          }
          if (observationSerial !== contactMailState.syncObservationSerial) { element.textContent = newerObservationText(); break; }
          const result = contactMailResult(response);
          if (confirming) {
            if (typeof result.found !== 'boolean' || (result.found ? !result.receipt : result.receipt !== null)) throw new Error('MAIL_INVALID_RESPONSE');
            validateContactMailSync(result.sync);
            if (!result.found) {
              observeContactMailSync(result.sync);
              element.textContent = `${renderContactMailSync(result.sync)} この要求の保存結果はまだ確認できません。自動では再送せず、要求IDを保持しています。同期状態を確認してください。`;
              break;
            }
            validateContactMailSync(result.receipt.sync, progress.executionId, true);
          } else validateContactMailSync(result.sync, progress.executionId);
          progress.started = true;
          progress.requestId = '';
          progress.requestPayload = null;
          progress.requestPending = false;
          observeContactMailSync(result.sync);
          element.textContent = `${progress.periodText || ''} ${renderContactMailSync(result.sync)} この操作: ${batch}/20回。`;
          renderContactMailSyncButton();
          if (result.sync.executionId !== progress.executionId) { contactMailState.syncProgress = null; element.textContent += ' 元の要求の成立を確認しました。現在は別の同期実行があるため、続行を停止しました。'; break; }
          if (['complete', 'needs_full_sync'].includes(result.sync.state)) { contactMailState.syncProgress = null; break; }
          if (result.sync.state !== 'running') break;
          if (contactMailState.syncStopRequested) {
            element.textContent += ' 続行を停止しました。送信済みの処理結果を反映しました。';
            break;
          }
          if (batch === 20) element.textContent += ' この操作の上限に達しました。続行ボタンで次の処理へ進めます。';
        }
      } catch (error) {
        if (serial !== contactMailState.syncSerial) return;
        if (observationSerial !== contactMailState.syncObservationSerial) { element.textContent = newerObservationText(); return; }
        if (!progress.requestPending && !progress.catalogPending && ['CONFLICT', 'MAIL_CATALOG_CHANGED', 'MAIL_CATALOG_INVALID', 'MAIL_REQUEST_CONFLICT'].includes(error.message)) contactMailState.syncProgress = null;
        element.textContent = `${contactMailErrorText(error.message)} 自動では再試行しません。送信済みの処理が終了したとは限りません。同期状態を更新するか、続行ボタンから明示的に再確認できます。`;
        if (progress.catalogPending && !progress.executionId) element.textContent += ' 元の受付ID計画を保持しています。現在のSheetで作り直す場合は「受付IDの計画を破棄して作り直す」を選んでください。';
      } finally {
        if (serial === contactMailState.syncSerial) { contactMailState.syncBusy = false; renderContactMailSyncButton(); }
      }
    }

    const contactMailIssueLabels = {
      pending: '照合待ち', unreviewed: '未確認メール', unavailable: 'メール取得不能', bodyUnverified: '本文未検証',
      bodyUnavailable: '本文取得不能', attachmentUnverified: '添付未検証', attachmentUnavailable: '添付取得不能',
      failed: '同期取得失敗', coverage: '関連メールの有無が未確認の案件', deleted: '取得前に削除され種類未確認',
    };

    function openContactMailIssues(reset = true) {
      if (document.getElementById('mailQueueModal').hidden) contactMailState.returnFocus = document.activeElement;
      clearContactMailView('queue');
      if (reset) Object.assign(contactMailState.issues, { pageToken: '', history: [], result: null });
      document.getElementById('mailQueueTitle').textContent = '全件確認の残件';
      document.getElementById('mailQueueModal').hidden = false;
      appView.inert = true;
      document.getElementById('mailQueueClose').focus();
      loadContactMailIssues();
    }

    async function loadContactMailIssues() {
      const current = contactMailState.issues;
      current.active = true;
      const serial = ++current.serial;
      current.result = null;
      renderContactMailIssues('対象を確認中...');
      try {
        const result = contactMailResult(await callServer('listContactMailIssues', { kind: current.kind, pageToken: current.pageToken }));
        if (serial !== current.serial) return;
        if (observeContactMailSync(result.sync)) return;
        current.result = validateContactMailIssues(result, current.kind);
        renderContactMailIssues();
      } catch (error) {
        if (serial !== current.serial) return;
        renderContactMailIssues(contactMailErrorText(error.message));
      }
    }

    function renderContactMailIssues(message = '') {
      const current = contactMailState.issues;
      const result = current.result;
      const root = contactMailRoot('queue');
      root.innerHTML = `<label>残件の種類 <select data-mail-issue-kind>${Object.entries(contactMailIssueLabels).map(([key, label]) => `<option value="${key}" ${current.kind === key ? 'selected' : ''}>${escapeHtml(label)}</option>`).join('')}</select></label>
        <p class="mail-sync">${escapeHtml(result ? renderContactMailSync(result.sync) : message)}</p>
        <p>メールの残件は保存済みメールを50件ずつ調べます。このページに該当がなくても、次のページが残っている場合があります。</p>
        <nav class="mail-navigation"><button type="button" data-mail-issue-prev ${!result || !current.history.length ? 'disabled' : ''}>前のページ</button><button type="button" data-mail-issue-next ${!result || !result.page.nextPageToken ? 'disabled' : ''}>次のページ</button><button type="button" data-mail-issue-reload>更新</button></nav>
        ${!result ? '' : `<p role="status">このページの対象 ${result.targets.length}件（${result.scannedCount}件を照合）</p>${!result.targets.length ? '<p>このページの対象は0件です。</p>' : `<ul>${result.targets.map((target, index) => `<li>${target.type === 'case' ? `受付ID: ${escapeHtml(target.caseId)} <button type="button" data-mail-issue-case="${index}">案件を開く</button>` : target.type === 'sync' ? `同期全体: ${escapeHtml(contactMailErrorText(target.errorCode))}` : `メールID: ${escapeHtml(target.messageId)}${target.message ? ` / ${escapeHtml(contactMailText(target.message.subject || '（件名なし）'))}${target.message.caseId ? ` / 受付ID: ${escapeHtml(target.message.caseId)}` : ''} <button type="button" data-mail-issue-open="${index}">メール・該当添付を開く</button>` : `<p>${target.type === 'deleted' ? '取得前に削除されたため、メールの種類と関連案件を確認できません。' : '本文取得前に同期が失敗しました。同期の再開後にメールを確認してください。'}</p>`}`}</li>`).join('')}</ul>`}`}`;
      root.querySelector('[data-mail-issue-kind]').addEventListener('change', (event) => {
        Object.assign(current, { kind: event.target.value, pageToken: '', history: [] });
        loadContactMailIssues();
      });
      root.querySelector('[data-mail-issue-reload]').addEventListener('click', loadContactMailIssues);
      root.querySelector('[data-mail-issue-prev]').addEventListener('click', () => { current.pageToken = current.history.pop() || ''; loadContactMailIssues(); });
      root.querySelector('[data-mail-issue-next]').addEventListener('click', () => { current.history.push(current.pageToken); current.pageToken = result.page.nextPageToken; loadContactMailIssues(); });
      root.querySelectorAll('[data-mail-issue-case]').forEach((button) => button.addEventListener('click', () => {
        const target = result.targets[Number(button.dataset.mailIssueCase)];
        closeContactMailQueue();
        selectSubmission(target.caseId);
      }));
      root.querySelectorAll('[data-mail-issue-open]').forEach((button) => button.addEventListener('click', () => {
        const target = result.targets[Number(button.dataset.mailIssueOpen)];
        clearContactMailView('queue');
        Object.assign(contactMailState.queue, { scope: 'issues', messages: [target.message], sync: result.sync, page: { previousPageToken: '', nextPageToken: '' }, status: 'loaded' });
        document.getElementById('mailQueueTitle').textContent = contactMailIssueLabels[current.kind];
        selectContactMail('queue', 0);
      }));
    }

    function openContactMailQueue(scope) {
      contactMailState.returnFocus = document.activeElement;
      clearContactMailView('queue');
      contactMailState.issues.active = false;
      contactMailState.queue.scope = scope;
      document.getElementById('mailQueueTitle').textContent = scope === 'pending' ? '照合待ちメール' : '未確認メール（全ステータス）';
      document.getElementById('mailQueueModal').hidden = false;
      appView.inert = true;
      document.getElementById('mailQueueClose').focus();
      loadContactMailList('queue');
    }

    function closeContactMailQueue() {
      contactMailState.issues.active = false;
      clearContactMailView('queue');
      document.getElementById('mailQueueModal').hidden = true;
      appView.inert = false;
      if (contactMailState.returnFocus && contactMailState.returnFocus.isConnected) contactMailState.returnFocus.focus();
      contactMailState.returnFocus = null;
    }

    async function loadContactMailList(view, options = {}) {
      const current = contactMailState[view];
      if (options.caseId) current.caseId = options.caseId;
      const serial = ++current.serial;
      ++current.detailSerial;
      current.urls.forEach((url) => URL.revokeObjectURL(url));
      Object.assign(current, { urls: [], messages: [], message: null, selectedIndex: -1, status: 'loading', error: '', pendingWrite: null, page: null, pageToken: options.pageToken || '' });
      renderContactMailView(view);
      try {
        const result = contactMailResult(await callServer('listContactMail', contactMailOptions(current, { pageToken: current.pageToken })));
        if (serial !== current.serial) return;
        validateContactMailList(result, current.scope, current.caseId);
        if (observeContactMailSync(result.sync)) return;
        current.messages = result.messages;
        current.page = result.page;
        current.sync = result.sync;
        current.status = 'loaded';
        renderContactMailView(view);
        if (current.messages.length) await selectContactMail(view, options.selectLast ? current.messages.length - 1 : 0);
      } catch (error) {
        if (serial !== current.serial) return;
        current.status = 'failed';
        current.error = contactMailErrorText(error.message);
        renderContactMailView(view);
      }
    }

    async function selectContactMail(view, index) {
      const current = contactMailState[view];
      if (current.writing || !current.messages[index]) return;
      const serial = ++current.detailSerial;
      current.urls.forEach((url) => URL.revokeObjectURL(url));
      current.urls = [];
      current.selectedIndex = index;
      current.message = null;
      current.pendingWrite = null;
      current.resolveCaseId = '';
      current.resolveReason = '';
      current.detailError = '';
      renderContactMailView(view);
      const messageId = current.messages[index].messageId;
      try {
        const result = contactMailResult(await callServer('getContactMailMessage', contactMailOptions(current, { messageId })));
        if (serial !== current.detailSerial) return;
        current.message = validateContactMailMessage(result, messageId);
        if ((current.scope === 'case' && (current.message.caseId !== current.caseId || current.message.matchState !== 'matched')) ||
          (current.scope === 'pending' && current.message.matchState !== 'pending') ||
          (current.scope === 'unreviewed' && (current.message.matchState !== 'matched' || current.message.firstReview))) throw new Error('MAIL_INVALID_RESPONSE');
        renderContactMailView(view);
      } catch (error) {
        if (serial !== current.detailSerial) return;
        current.detailError = contactMailErrorText(error.message);
        renderContactMailView(view);
      }
    }

    function moveContactMail(view, delta) {
      const current = contactMailState[view];
      if (current.writing || current.status !== 'loaded') return;
      const next = current.selectedIndex + delta;
      if (next >= 0 && next < current.messages.length) return selectContactMail(view, next);
      else {
        const token = delta < 0 ? current.page.previousPageToken : current.page.nextPageToken;
        if (token) return loadContactMailList(view, { pageToken: token, selectLast: delta < 0 });
      }
    }

    function contactMailReviewHtml(message, writing) {
      return `<span>${message.firstReview ? `最初の確認: ${escapeHtml(message.firstReview.email)} / ${escapeHtml(formatDate(message.firstReview.at))}` : '未確認'}</span>${message.matchState === 'matched' && !message.firstReview ? message.reviewReady === true && !message.unavailable ? `<button type="button" data-mail-review ${writing ? 'disabled' : ''}>このメールを確認済みにする</button>` : '<span>本文とすべての添付を取得してから確認済みにできます。</span>' : ''}`;
    }

    function renderContactMailView(view) {
      const current = contactMailState[view];
      const root = contactMailRoot(view);
      ++current.attachmentSerial;
      current.urls.forEach((url) => URL.revokeObjectURL(url));
      current.urls = [];
      root.hidden = false;
      const heading = view === 'case' ? '<h2>関連メール</h2>' : '';
      if (current.status === 'loading') { root.innerHTML = `${heading}<p class="muted" role="status">メールを読み込み中...</p>`; return; }
      if (current.status === 'failed') {
        root.innerHTML = `${heading}<p class="error" role="status">${escapeHtml(current.error)}</p><button type="button" data-mail-reload>更新</button>`;
        root.querySelector('[data-mail-reload]').addEventListener('click', () => current.scope === 'issues' ? selectContactMail(view, current.selectedIndex) : loadContactMailList(view));
        return;
      }
      if (current.status !== 'loaded') return;
      const message = current.message;
      const previousDisabled = current.writing || (current.selectedIndex <= 0 && !current.page.previousPageToken);
      const nextDisabled = current.writing || (current.selectedIndex >= current.messages.length - 1 && !current.page.nextPageToken);
      root.innerHTML = `${heading}
        ${current.scope === 'issues' ? '<p><button type="button" data-mail-issues-back>残件一覧に戻る</button></p>' : ''}
        <p class="mail-sync">${escapeHtml(renderContactMailSync(current.sync))}</p>
        ${current.scope === 'pending' && viewerContext.authMode === 'domain' ? `<p><button type="button" data-mail-reconcile ${current.writing ? 'disabled' : ''}>${current.reconcilePageToken ? '照合待ちの再照合を続行' : '照合待ちを再照合'}</button> <span role="status">${escapeHtml(current.reconcileMessage || '')}</span></p>` : ''}
        <div class="mail-navigation"><button type="button" data-mail-prev ${previousDisabled ? 'disabled' : ''}>← 前のメール</button>
        <select data-mail-select aria-label="メールを選択" ${current.writing || !current.messages.length ? 'disabled' : ''}>${current.messages.map((item, index) => `<option value="${index}" ${index === current.selectedIndex ? 'selected' : ''}>${escapeHtml(formatDate(item.internalDate))} ${item.firstReview ? '確認済み' : '未確認'} ${escapeHtml(contactMailText(item.subject || '（件名なし）'))}</option>`).join('')}</select>
        <button type="button" data-mail-next ${nextDisabled ? 'disabled' : ''}>次のメール →</button><button type="button" data-mail-reload ${current.writing ? 'disabled' : ''}>更新</button></div>
        ${!current.messages.length ? `<p class="muted">${current.scope === 'case' ? '現在紐付いているメールは0件です。同期・照合の未完了を確認し、関連メールの有無を受入時に照合してください。' : '現在の条件で表示できるメールは0件です。同期・照合の未完了も確認してください。'}</p>` : current.detailError ? `<p class="error" role="status">${escapeHtml(current.detailError)}</p>` : !message ? '<p class="muted" role="status">メール本文を読み込み中...</p>' : `
          <h3>${escapeHtml(contactMailText(message.subject || '（件名なし）'))}</h3>
          <div class="grid"><div class="label">日時</div><div>${escapeHtml(formatDate(message.internalDate))}</div><div class="label">送受信</div><div>${message.direction === 'sent' ? '送信' : message.direction === 'received' ? '受信' : '送受信不明'}</div><div class="label">差出人</div><div>${escapeHtml(contactMailText(message.from))}</div><div class="label">宛先</div><div>${escapeHtml(contactMailText(message.to))}</div><div class="label">案件</div><div>${escapeHtml(message.caseId || '照合待ち')}</div>${message.reason ? `<div class="label">照合の状態</div><div>${escapeHtml(contactMailMatchReason(message.reason))}</div>` : ''}${message.matchState === 'pending' && message.evidence && Array.isArray(message.evidence.bodyCaseIds) && message.evidence.bodyCaseIds.length ? `<div class="label">本文の受付ID</div><div>${escapeHtml(message.evidence.bodyCaseIds.join(' / '))}</div>` : ''}</div>
          <div class="mail-review">${contactMailReviewHtml(message, current.writing)}</div>
          ${message.matchState === 'pending' ? `<div class="mail-resolve"><input data-mail-case-id aria-label="紐付ける受付ID" placeholder="紐付ける受付ID" value="${escapeHtml(current.resolveCaseId || '')}" ${current.writing ? 'disabled' : ''}><input data-mail-reason aria-label="照合の理由" placeholder="照合・対象外の理由（必須）" maxlength="1000" value="${escapeHtml(current.resolveReason || '')}" ${current.writing ? 'disabled' : ''}><button type="button" data-mail-match ${current.writing ? 'disabled' : ''}>紐付けを確定</button><button type="button" data-mail-exclude ${current.writing ? 'disabled' : ''}>対象外にする</button></div>` : ''}
          <p class="error" data-mail-write-error role="status">${escapeHtml(current.writeError || '')}</p>
          ${message.unavailable || message.bodyAvailability === 'unavailable' ? '<p class="error">このメールの本文は取得不能です。全件確認の達成対象には含められません。</p>' : `<div class="mail-body">${escapeHtml(contactMailText(message.bodyText || '（本文なし）'))}</div>`}
          ${message.attachments.map((attachment) => `<div class="mail-attachment" data-mail-part="${escapeHtml(attachment.partId)}"><strong>${escapeHtml(contactMailText(attachment.name || '添付ファイル'))}</strong> <span class="muted">${escapeHtml(attachment.mimeType)} / ${attachment.size} bytes / part ${escapeHtml(attachment.partId)} / <span data-mail-availability>${{ verified: '取得確認済み', unavailable: '取得不能', unverified: '未検証' }[attachment.availability] || '未検証'}</span></span><br><button type="button" data-mail-attachment="${escapeHtml(attachment.partId)}" ${message.unavailable ? 'disabled' : ''}>添付を確認・取得</button><div data-mail-attachment-preview></div></div>`).join('')}`}`;
      const issuesBack = root.querySelector('[data-mail-issues-back]');
      if (issuesBack) issuesBack.addEventListener('click', () => openContactMailIssues(false));
      root.querySelector('[data-mail-prev]').addEventListener('click', () => moveContactMail(view, -1));
      root.querySelector('[data-mail-next]').addEventListener('click', () => moveContactMail(view, 1));
      root.querySelector('[data-mail-select]').addEventListener('change', (event) => selectContactMail(view, Number(event.target.value)));
      root.querySelector('[data-mail-reload]').addEventListener('click', () => current.scope === 'issues' ? selectContactMail(view, current.selectedIndex) : loadContactMailList(view, { pageToken: current.pageToken }));
      const review = root.querySelector('[data-mail-review]');
      const reconcile = root.querySelector('[data-mail-reconcile]');
      if (reconcile) reconcile.addEventListener('click', reconcileContactMailPendingFromUi);
      if (review) review.addEventListener('click', () => writeContactMail(view, 'review'));
      const match = root.querySelector('[data-mail-match]');
      if (match) match.addEventListener('click', () => writeContactMail(view, 'match'));
      const exclude = root.querySelector('[data-mail-exclude]');
      if (exclude) exclude.addEventListener('click', () => writeContactMail(view, 'exclude'));
      root.querySelectorAll('[data-mail-attachment]').forEach((button) => button.addEventListener('click', () => loadContactMailAttachment(view, button.dataset.mailAttachment, button)));
    }

    async function reconcileContactMailPendingFromUi() {
      const current = contactMailState.queue;
      if (current.scope !== 'pending' || current.writing || viewerContext.authMode !== 'domain') return;
      const serial = current.serial;
      current.writing = true;
      current.reconcileRequestId = current.reconcileRequestId || window.crypto.randomUUID();
      current.reconcileMessage = '照合待ちを再照合中...';
      renderContactMailView('queue');
      try {
        const result = contactMailResult(await callServer('reconcileContactMailPending', { pageToken: current.reconcilePageToken || '', requestId: current.reconcileRequestId }));
        if (serial !== current.serial) return;
        if (!Number.isInteger(result.processedCount) || !result.page || typeof result.page.nextPageToken !== 'string') throw new Error('MAIL_INVALID_RESPONSE');
        if (observeContactMailSync(result.sync)) return;
        current.reconcilePageToken = result.page.nextPageToken;
        current.reconcileRequestId = '';
        current.reconcileMessage = `${result.processedCount}件を再照合しました。${current.reconcilePageToken ? '続行ボタンで次へ進めます。' : 'この回の再照合は完了です。'}`;
        current.writing = false;
        await loadContactMailList('queue');
        loadContactMailSyncStatus();
      } catch (error) {
        if (serial !== current.serial) return;
        current.writing = false;
        current.reconcileMessage = contactMailErrorText(error.message);
        renderContactMailView('queue');
      }
    }

    async function writeContactMail(view, action) {
      const current = contactMailState[view];
      if (current.writing || !current.message) return;
      const message = current.message;
      if (action === 'review' && message.reviewReady !== true) return;
      const serial = current.detailSerial;
      const caseId = action === 'match' ? contactMailRoot(view).querySelector('[data-mail-case-id]').value.trim() : '';
      const reason = action !== 'review' ? contactMailRoot(view).querySelector('[data-mail-reason]').value.trim() : '';
      current.resolveCaseId = caseId;
      current.resolveReason = reason;
      if (action === 'match' && !caseId) { current.writeError = '紐付ける受付IDを入力してください。'; renderContactMailView(view); return; }
      if (action !== 'review' && (!reason || reason.length > 1000)) { current.writeError = '照合・対象外の理由を1000文字以内で入力してください。'; renderContactMailView(view); return; }
      if (action === 'exclude' && !window.confirm('このメールを問い合わせの対象外にしますか？')) return;
      const signature = JSON.stringify({ action, caseId, reason, messageId: message.messageId, version: message.version });
      if (!current.pendingWrite || current.pendingWrite.signature !== signature) current.pendingWrite = { signature, requestId: window.crypto.randomUUID() };
      const requestId = current.pendingWrite.requestId;
      current.writing = true;
      current.writeError = '';
      renderContactMailView(view);
      try {
        const options = { messageId: message.messageId, expectedVersion: message.version, requestId };
        const result = contactMailResult(await callServer(action === 'review' ? 'markContactMailReviewed' : 'resolveContactMailPending',
          action === 'review' ? contactMailOptions(current, options) : { ...options, action, reason, ...(caseId ? { caseId } : {}) }));
        if (serial !== current.detailSerial) return;
        if (!validContactMailSummary(result.message) || result.message.messageId !== message.messageId) throw new Error('MAIL_INVALID_RESPONSE');
        current.writing = false;
        current.pendingWrite = null;
        if (current.scope === 'issues') openContactMailIssues(false);
        else if (current.scope !== 'case') await loadContactMailList(view, { pageToken: current.pageToken });
        else {
          current.message = { ...message, ...result.message };
          current.messages[current.selectedIndex] = result.message;
          renderContactMailView(view);
        }
        loadContactMailSyncStatus();
      } catch (error) {
        if (serial !== current.detailSerial) return;
        current.writing = false;
        current.writeError = contactMailErrorText(error.message);
        renderContactMailView(view);
      }
    }

    async function loadContactMailAttachment(view, partId, button) {
      const current = contactMailState[view];
      const message = current.message;
      if (!message || !message.attachments.some((attachment) => attachment.partId === partId)) return;
      const serial = current.detailSerial;
      const attachmentSerial = current.attachmentSerial;
      const panel = button.parentElement.querySelector('[data-mail-attachment-preview]');
      button.disabled = true;
      panel.textContent = '添付を読み込み中...';
      const chunks = [];
      let offset = 0;
      let metadata;
      let reviewReady = false;
      try {
        while (true) {
          const result = contactMailResult(await callServer('getContactMailAttachmentChunk', contactMailOptions(current, { messageId: message.messageId, partId, offset })));
          if (serial !== current.detailSerial || attachmentSerial !== current.attachmentSerial) return;
          const bytes = validateContactMailChunk(result, offset, partId);
          if (metadata && (metadata.size !== result.totalSize || metadata.mimeType !== result.attachment.mimeType)) throw new Error('MAIL_INVALID_RESPONSE');
          metadata = { ...result.attachment, size: result.totalSize };
          reviewReady = result.reviewReady === true;
          chunks.push(bytes);
          offset = result.nextOffset;
          panel.textContent = `添付を読み込み中... ${offset} / ${result.totalSize} bytes`;
          if (result.done) break;
        }
        if (metadata.availability !== 'verified') throw new Error('MAIL_INVALID_RESPONSE');
        const stored = message.attachments.find((item) => item.partId === partId);
        stored.availability = metadata.availability;
        message.reviewReady = reviewReady;
        button.parentElement.querySelector('[data-mail-availability]').textContent = '取得確認済み';
        const reviewRoot = contactMailRoot(view).querySelector('.mail-review');
        reviewRoot.innerHTML = contactMailReviewHtml(message, current.writing);
        const reviewButton = reviewRoot.querySelector('[data-mail-review]');
        if (message.reviewReady && reviewButton) reviewButton.addEventListener('click', () => writeContactMail(view, 'review'));
        const blob = new Blob(chunks, { type: metadata.mimeType });
        const url = URL.createObjectURL(blob);
        current.urls.push(url);
        panel.innerHTML = `<a href="${escapeHtml(url)}" download="${escapeHtml(metadata.name || 'attachment')}">ファイルを保存</a>`;
        if (metadata.previewKind === 'image' && ['image/png', 'image/jpeg', 'image/gif', 'image/webp'].includes(metadata.mimeType)) {
          const image = document.createElement('img'); image.src = url; image.alt = metadata.name; panel.appendChild(image);
        } else if (metadata.previewKind === 'pdf' && metadata.mimeType === 'application/pdf') {
          // The service verifies PDF bytes; use the browser PDF viewer, never an HTML document.
          const frame = document.createElement('iframe'); frame.src = url; frame.title = metadata.name; frame.setAttribute('referrerpolicy', 'no-referrer'); panel.appendChild(frame);
        } else if (metadata.previewKind === 'text') {
          const text = await blob.text();
          if (serial !== current.detailSerial || attachmentSerial !== current.attachmentSerial) return;
          const pre = document.createElement('pre'); pre.textContent = contactMailText(text); panel.appendChild(pre);
        }
      } catch (error) {
        if (serial !== current.detailSerial || attachmentSerial !== current.attachmentSerial) return;
        panel.textContent = `${contactMailErrorText(error.message)} 再取得はボタンから行ってください。`;
      } finally {
        if (serial === current.detailSerial && attachmentSerial === current.attachmentSerial && button.isConnected) button.disabled = false;
      }
    }

    let viewerContext = window.CONTACT_VIEWER_CONTEXT || {};

    function showDenied(message) {
      ++contactMailState.syncSerial;
      ++contactMailState.syncObservationSerial;
      contactMailState.sync = null;
      contactMailState.periodObserved = false;
      contactMailState.periodStartAt = null;
      contactMailState.syncProgress = null;
      contactMailState.syncBusy = false;
      contactMailState.syncStopRequested = false;
      Object.assign(contactMailState.issues, { pageToken: '', history: [], result: null });
      clearContactMailView('case');
      closeContactMailQueue();
      document.getElementById('mailSyncSummary').textContent = '';
      document.getElementById('syncMailButton').hidden = true;
      document.getElementById('stopMailSyncButton').hidden = true;
      document.getElementById('restartMailCatalogButton').hidden = true;
      document.getElementById('mailSyncStatusButton').disabled = false;
      ++state.listRequestSerial;
      ++state.detailRequestSerial;
      ++state.saveRequestSerial;
      state.submissions = [];
      state.detail = null;
      state.dirty = false;
      state.loading = false;
      state.saving = false;
      state.listState = 'unobserved';
      state.counts = { total: 0, active: 0, 未対応: 0, 対応中: 0, 保留: 0, 対応済み: 0 };
      state.page = { total: 0, from: 0, to: 0, previousPageToken: '', nextPageToken: '' };
      state.currentPageToken = '';
      submissionRows.innerHTML = '';
      detailView.innerHTML = '';
      statusSummary.innerHTML = '';
      pagePosition.textContent = '';
      casePosition.textContent = '';
      resetAttachmentModalState();
      viewerContext = {};
      viewerEmail.textContent = '';
      attachmentModalImage.removeAttribute('src');
      attachmentModalCaption.textContent = '';
      deniedMessage.textContent = message;
      deniedView.hidden = false;
      appView.hidden = true;
    }

    function showApp() {
      viewerEmail.textContent = viewerContext.email || '';
      deniedView.hidden = true;
      appView.hidden = false;
      refreshButton.addEventListener('click', loadList);
      pagePrev.addEventListener('click', () => loadList({ pageToken: state.page.previousPageToken, selectEdge: 'first' }));
      pageNext.addEventListener('click', () => loadList({ pageToken: state.page.nextPageToken, selectEdge: 'first' }));
      casePrev.addEventListener('click', () => moveCase(-1));
      caseNext.addEventListener('click', () => moveCase(1));
      searchInput.addEventListener('input', () => {
        window.clearTimeout(searchInput._timer);
        searchInput._timer = window.setTimeout(loadList, 250);
      });
      statusFilter.addEventListener('change', loadList);
      loadList();
      loadContactMailSyncStatus();
      renderContactMailSyncButton();
      document.getElementById('syncMailButton').addEventListener('click', advanceContactMailSyncFromUi);
      document.getElementById('stopMailSyncButton').addEventListener('click', stopContactMailSyncFromUi);
      document.getElementById('restartMailCatalogButton').addEventListener('click', discardContactMailCatalogFromUi);
      document.getElementById('mailSyncStatusButton').addEventListener('click', loadContactMailSyncStatus);
      document.getElementById('unreviewedMailButton').addEventListener('click', () => openContactMailQueue('unreviewed'));
      document.getElementById('pendingMailButton').addEventListener('click', () => openContactMailQueue('pending'));
      document.getElementById('mailIssuesButton').addEventListener('click', () => openContactMailIssues());
      document.getElementById('mailQueueClose').addEventListener('click', closeContactMailQueue);
    }

    async function bootstrapViewer() {
      try {
        viewerContext = await callServer('getViewerContext');
        if (!viewerContext || !viewerContext.allowed) {
          showDenied('社員は社内Googleアカウント、それ以外は通常URLの専用Googleログインから開いてください。');
          return;
        }
        applyViewerLocationState(await getAppsScriptLocation());
        showApp();
      } catch (_error) {
        showDenied('アクセスを確認できません。許可されたGoogleアカウントで通常URLから開き直してください。');
      }
    }

    attachmentModal.addEventListener('click', (event) => {
      if (event.target === attachmentModal) {
        closeAttachmentViewer();
      }
    });
    attachmentModalClose.addEventListener('click', closeAttachmentViewer);
    attachmentModalPrev.addEventListener('click', () => moveAttachmentViewer(-1));
    attachmentModalNext.addEventListener('click', () => moveAttachmentViewer(1));
    document.addEventListener('keydown', (event) => {
      const queue = document.getElementById('mailQueueModal');
      if (!queue.hidden) {
        if (event.key === 'Escape') { event.preventDefault(); closeContactMailQueue(); }
        if (event.key === 'Tab') {
          const controls = [...queue.querySelectorAll('button:not([disabled]), select:not([disabled]), input:not([disabled]), a[href], iframe')];
          const first = controls[0];
          const last = controls[controls.length - 1];
          if (first && event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (last && !event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
        return;
      }
      if (attachmentModal.hidden) return;
      if (event.key === 'Escape') closeAttachmentViewer();
      if (event.key === 'ArrowLeft') moveAttachmentViewer(-1);
      if (event.key === 'ArrowRight') moveAttachmentViewer(1);
    });
    bootstrapViewer();
  </script>
</body>
