<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPEED AD 管理画面 アーキテクチャマップ</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --ink:#1b2432; --ink-2:#5b6577; --ink-3:#8a93a5;
  --line:#e2e6ed; --line-2:#cfd006; --accent:#2f62d4; --accent-soft:#eaf0fd;
  --warn:#8a6414; --warn-bg:#fdf6ec; --danger:#c23934;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
  --l-infra:#64748b; --l-runtime:#2f62d4; --l-chrome:#0e8a86; --l-style:#7c56c4;
  --l-screen:#1f4fb8; --l-external:#a2660c; --l-legacy:#a4485c;
  --canvasbg:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f141c; --panel:#161d27; --ink:#e8ecf4; --ink-2:#a8b2c4; --ink-3:#78829a;
    --line:#27303e; --accent:#7aa2ef; --accent-soft:#1b2740;
    --warn:#e2c07a; --warn-bg:#2a2416; --danger:#e2857f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --l-infra:#94a3b8; --l-runtime:#7aa2ef; --l-chrome:#4fc4bf; --l-style:#b195e8;
    --l-screen:#8fb0f5; --l-external:#e0ac54; --l-legacy:#e08a9c;
    --canvasbg:#131922;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit; font-size:inherit; color:inherit}

/* ---------- レイアウト ---------- */
.app{display:flex; flex-direction:column; height:100vh; min-height:0}
.topbar{
  flex:none; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto; min-width:0}
.brand h1{margin:0; font-size:15.5px; font-weight:700; letter-spacing:.01em; white-space:nowrap}
.brand .sub{font-size:11.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.searchwrap{position:relative; display:flex; align-items:center}
.searchwrap input{
  width:230px; padding:7px 30px 7px 11px; border:1px solid var(--line); border-radius:7px;
  background:var(--bg); outline:none;
}
.searchwrap input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.searchwrap .hint{position:absolute; right:9px; font-size:10.5px; color:var(--ink-3); pointer-events:none}
.searchcount{font-size:11.5px; color:var(--ink-2); min-width:66px}
.tbtn{
  background:var(--panel); border:1px solid var(--line); border-radius:7px;
  padding:6px 12px; font-size:12.5px; cursor:pointer; white-space:nowrap;
}
.tbtn:hover{border-color:var(--accent); color:var(--accent)}

.filters{
  flex:none; display:flex; align-items:center; gap:8px 16px; flex-wrap:wrap;
  padding:8px 18px; background:var(--panel); border-bottom:1px solid var(--line);
}
.fgroup{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.flabel{font-size:11px; font-weight:700; color:var(--ink-3); letter-spacing:.04em; white-space:nowrap}
.chip{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer; -webkit-user-select:none; user-select:none;
  border:1px solid var(--line); border-radius:999px; padding:3px 11px 3px 8px;
  font-size:11.5px; background:var(--panel); color:var(--ink-2); white-space:nowrap;
}
.chip .dot{width:9px; height:9px; border-radius:50%; background:currentColor; flex:none}
.chip.on{color:var(--ink); border-color:currentColor; background:var(--accent-soft)}
.chip.off{opacity:.45}
.chip input{display:none}

.main{flex:1; display:grid; grid-template-columns:minmax(0,1fr) 384px; min-height:0}
.stage{position:relative; min-width:0; background:var(--canvasbg); overflow:hidden}
svg#graph{width:100%; height:100%; display:block; cursor:grab; touch-action:none}
svg#graph.dragging{cursor:grabbing}

.zoomctl{
  position:absolute; left:14px; bottom:14px; display:flex; gap:6px;
  background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:5px;
  box-shadow:var(--shadow);
}
.zoomctl button{
  width:30px; height:28px; border:none; background:transparent; border-radius:6px;
  cursor:pointer; font-size:14px; line-height:1; color:var(--ink-2);
}
.zoomctl button.wide{width:auto; padding:0 10px; font-size:11.5px}
.zoomctl button:hover{background:var(--accent-soft); color:var(--accent)}

.stagenote{
  position:absolute; right:14px; bottom:14px; font-size:11px; color:var(--ink-3);
  background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:5px 10px;
  box-shadow:var(--shadow); pointer-events:none; max-width:320px;
}

/* ---------- ノード ---------- */
.node{cursor:pointer}
.node rect.box{fill:var(--panel); stroke-width:1.4}
.node .nm{font-size:12.4px; font-weight:700; fill:var(--ink)}
.node .sb{font-size:10.5px; fill:var(--ink-3)}
.node .badge{font-size:9.5px; font-weight:700}
.node:hover rect.box{filter:drop-shadow(0 3px 10px rgba(20,40,90,.18))}
.node.sel rect.box{stroke-width:2.6}
.node.dim{opacity:.16}
.node.hidden{display:none}
.node.match rect.box{stroke-dasharray:none}
.node.pulse rect.box{animation:pulse 1s ease-out 2}
@keyframes pulse{0%{stroke-width:1.4}30%{stroke-width:4}100%{stroke-width:1.4}}
.node.unreach rect.box{stroke-dasharray:5 3}

.cluster rect{fill:none; stroke:var(--line); stroke-width:1.2; stroke-dasharray:4 4}
.cluster text{font-size:11px; font-weight:700; fill:var(--ink-3); letter-spacing:.06em}

.edge{fill:none; stroke-width:1.5; opacity:.62}
.edge.dim{opacity:.05}
.edge.hi{stroke-width:3.2; opacity:1}
.edge.hidden{display:none}
.edgelabel{font-size:10px; fill:var(--ink-2); paint-order:stroke; stroke:var(--canvasbg); stroke-width:3px}

/* ---------- ツールチップ ---------- */
#tip{
  position:fixed; z-index:60; max-width:390px; pointer-events:none; opacity:0;
  transition:opacity .1s; background:var(--panel); border:1px solid var(--line);
  border-radius:10px; box-shadow:var(--shadow); padding:12px 14px;
}
#tip.on{opacity:1}
#tip .tt-h{display:flex; align-items:center; gap:8px; margin-bottom:6px}
#tip .tt-n{font-size:13.5px; font-weight:700}
#tip .tt-t{font-size:10px; font-weight:700; padding:1px 7px; border-radius:4px; white-space:nowrap}
#tip .tt-d{font-size:11.8px; color:var(--ink-2); margin-bottom:8px}
#tip dl{margin:0; display:grid; grid-template-columns:64px 1fr; gap:3px 10px; font-size:11.3px}
#tip dt{color:var(--ink-3); font-weight:700}
#tip dd{margin:0; color:var(--ink-2); min-width:0}
#tip ul{margin:0; padding-left:14px}
#tip .tt-f{margin-top:8px; font-size:10.5px; color:var(--ink-3); border-top:1px solid var(--line); padding-top:6px}

/* ---------- 右パネル ---------- */
.panel{
  border-left:1px solid var(--line); background:var(--panel);
  display:flex; flex-direction:column; min-height:0; min-width:0;
}
.ptabs{flex:none; display:flex; border-bottom:1px solid var(--line)}
.ptab{
  flex:1; padding:11px 8px; border:none; background:transparent; cursor:pointer;
  font-size:12.5px; font-weight:700; color:var(--ink-3); border-bottom:2px solid transparent;
}
.ptab.on{color:var(--accent); border-bottom-color:var(--accent)}
.pbody{flex:1; overflow-y:auto; padding:14px 16px 40px; min-height:0}
.pbody::-webkit-scrollbar{width:9px}
.pbody::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px}

.pintro{font-size:11.8px; color:var(--ink-2); margin:0 0 12px; line-height:1.75}
.fcat{font-size:10.5px; font-weight:700; color:var(--ink-3); letter-spacing:.08em; margin:14px 0 6px}
.fcat:first-of-type{margin-top:0}
.flow{
  border:1px solid var(--line); border-radius:9px; margin-bottom:7px; overflow:hidden;
  background:var(--panel);
}
.flow.on{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.fhead{
  width:100%; text-align:left; border:none; background:transparent; cursor:pointer;
  padding:9px 12px; display:flex; align-items:flex-start; gap:9px;
}
.fhead:hover{background:var(--accent-soft)}
.fnum{
  flex:none; width:20px; height:20px; border-radius:6px; background:var(--accent-soft);
  color:var(--accent); font-size:10.5px; font-weight:700; display:flex;
  align-items:center; justify-content:center; margin-top:1px;
}
.flow.on .fnum{background:var(--accent); color:#fff}
.fname{font-size:12.6px; font-weight:700; line-height:1.45}
.fdesc{font-size:11px; color:var(--ink-3); margin-top:2px; line-height:1.6}
.fsteps{display:none; padding:2px 12px 12px; border-top:1px dashed var(--line)}
.flow.on .fsteps{display:block}
.fmeta{font-size:11px; color:var(--ink-2); margin:9px 0 10px; padding:7px 10px;
  background:var(--warn-bg); border:1px solid var(--line); border-radius:7px; color:var(--warn)}
.step{
  display:grid; grid-template-columns:20px 1fr; gap:9px; padding:7px 0;
  border-bottom:1px dashed var(--line); cursor:pointer;
}
.step:last-child{border-bottom:none}
.step:hover .stx{color:var(--accent)}
.sn{font-size:10.5px; font-weight:700; color:var(--ink-3); text-align:right; padding-top:1px}
.stn{font-size:11.5px; font-weight:700}
.stx{font-size:11.3px; color:var(--ink-2); line-height:1.65}
.sev{font-size:10px; color:var(--ink-3); margin-top:3px; word-break:break-all}

.dsec{margin-bottom:14px}
.dsec h4{
  margin:0 0 6px; font-size:10.5px; font-weight:700; color:var(--ink-3); letter-spacing:.08em;
}
.dsec ul{margin:0; padding-left:16px; font-size:11.8px; color:var(--ink-2); line-height:1.75}
.dsec p{margin:0; font-size:12px; color:var(--ink-2); line-height:1.8}
.dhead{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px}
.dhead h3{margin:0; font-size:15px; font-weight:700}
.tag{font-size:10px; font-weight:700; padding:2px 8px; border-radius:5px; white-space:nowrap}
.tag.ok{background:var(--accent-soft); color:var(--accent)}
.tag.no{background:var(--warn-bg); color:var(--warn)}
.path{
  display:block; font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
  font-size:11px; color:var(--ink-2); background:var(--bg); border:1px solid var(--line);
  border-radius:5px; padding:3px 7px; margin-bottom:3px; word-break:break-all;
}
.pill{
  display:inline-block; font-size:10.8px; border:1px solid var(--line); border-radius:999px;
  padding:2px 9px; margin:0 4px 4px 0; color:var(--ink-2);
}
.edgerow{
  display:flex; align-items:flex-start; gap:8px; padding:6px 0;
  border-bottom:1px dashed var(--line); font-size:11.4px; cursor:pointer;
}
.edgerow:last-child{border-bottom:none}
.edgerow:hover{color:var(--accent)}
.edgerow .dir{flex:none; font-size:10px; font-weight:700; color:var(--ink-3); width:26px; text-align:center; padding-top:2px}
.edgerow .er-n{font-weight:700}
.edgerow .er-d{color:var(--ink-3); font-size:10.8px; line-height:1.6}
.empty{font-size:12px; color:var(--ink-3); padding:24px 4px; text-align:center; line-height:1.9}
.finding{border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:8px}
.finding h5{margin:0 0 4px; font-size:12.4px; font-weight:700; display:flex; gap:7px; align-items:center}
.sev-b{font-size:9.5px; font-weight:700; padding:1px 7px; border-radius:4px; white-space:nowrap}
.sev-high{background:#fdecea; color:#b3261e}
.sev-medium{background:var(--warn-bg); color:var(--warn)}
.sev-low{background:var(--accent-soft); color:var(--accent)}
.sev-info{background:var(--bg); color:var(--ink-3)}
.sev-b.done{background:#e6f4ec; color:#237a52}
.sev-b.partial{background:#eef2fb; color:#2b57b8}
@media (prefers-color-scheme: dark){
  .sev-high{background:#3a1d1c; color:#e2857f}
  .sev-b.done{background:#17301f; color:#6cc491}
  .sev-b.partial{background:#1b2740; color:#7aa2ef}
}
.finding.closed{border-left:3px solid #2b8a4b}
.finding p{margin:0 0 5px; font-size:11.4px; color:var(--ink-2); line-height:1.7}
.finding p.res{color:#237a52; background:#f2f9f5; border-radius:6px; padding:6px 9px}
@media (prefers-color-scheme: dark){ .finding p.res{color:#6cc491; background:#16241c} }
.finding .fx{font-size:10.6px; color:var(--ink-3); line-height:1.65}
.rev{border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:8px; padding:10px 12px; margin-bottom:8px}
.rev b{font-size:11px} .rev ul{margin:4px 0 8px; padding-left:16px; font-size:11.2px; color:var(--ink-2); line-height:1.7}
.legend{display:grid; grid-template-columns:1fr; gap:5px; font-size:11.3px; color:var(--ink-2)}
.legend .lr{display:flex; align-items:center; gap:8px}
.legend .sw{width:26px; height:0; border-top-width:2.5px; border-top-style:solid; flex:none}
.legend .bx{width:16px; height:12px; border-radius:3px; border-width:1.6px; border-style:solid; flex:none; background:var(--panel)}

@media (max-width:1120px){
  .main{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(300px,1fr) minmax(0,42vh)}
  .panel{border-left:none; border-top:1px solid var(--line)}
  .searchwrap input{width:170px}
}
@media (max-width:620px){
  .brand .sub{display:none}
  .topbar,.filters{padding-left:12px; padding-right:12px}
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <h1>SPEED AD 管理画面 アーキテクチャマップ</h1>
      <span class="sub" id="brandSub"></span>
    </div>
    <div class="searchwrap">
      <input id="q" type="search" placeholder="ノード・ファイル・技術を検索" aria-label="検索">
      <span class="hint">/</span>
    </div>
    <span class="searchcount" id="qcount"></span>
    <button type="button" class="tbtn" id="btnClear">選択解除</button>
  </header>

  <div class="filters">
    <div class="fgroup">
      <span class="flabel">レイヤー</span>
      <span id="layerChips"></span>
    </div>
    <div class="fgroup">
      <span class="flabel">関係</span>
      <span id="kindChips"></span>
    </div>
  </div>

  <div class="main">
    <div class="stage">
      <svg id="graph" role="img" aria-label="管理画面のコンポーネント依存図"></svg>
      <div class="zoomctl">
        <button type="button" id="zIn"  title="拡大" aria-label="拡大">＋</button>
        <button type="button" id="zOut" title="縮小" aria-label="縮小">−</button>
        <button type="button" id="zFit" class="wide" title="全体表示" aria-label="全体表示">全体</button>
      </div>
      <div class="stagenote" id="stageNote">ドラッグで移動 / ホイールで拡大縮小 / ノード押下で詳細</div>
    </div>

    <aside class="panel">
      <div class="ptabs">
        <button type="button" class="ptab on" data-tab="flows">主要フロー</button>
        <button type="button" class="ptab" data-tab="detail">ノード詳細</button>
        <button type="button" class="ptab" data-tab="findings">発見事項</button>
      </div>
      <div class="pbody" id="pFlows"></div>
      <div class="pbody" id="pDetail" hidden></div>
      <div class="pbody" id="pFindings" hidden></div>
    </aside>
  </div>
</div>

<div id="tip" aria-hidden="true"></div>

入力を想定している。"],"revisions":[{"date":"2026-08-06","summary":"初版の誤り2点を訂正し、同日のコード修正を反映した","corrections":["「#footer-placeholder を持つのは invoice-management.html の1枚」は誤り。到達16画面は0枚で、invoice で一致したのは stripChrome() 内の iframe 用CSSセレクタ文字列だった","「利用者側で dark を選ぶと管理画面が想定外のダークで表示される」は誤り。管理画面は var(--color-*) を1つも使わないため視覚的影響はない"],"codeChanges":["proto-ui.js に pDlPick / pListCsv を集約し、5画面の重複 inline 定義を削除（F-03）","proto-level.js に window.pLevel() を追加し、3箇所の localStorage 直読みを置換（F-05）","admin.js の loadCommonHtml() に注入先の事前確認を追加（F-06）","未参照16ファイルと common/footer.html に「未参照・現行はどこか・残置の理由」の注記を追加（F-01）"]},{"date":"2026-08-06 (2)","summary":"未対応だった7件を解消した（F-02・F-10 は注記と検査で手当て、残る5件は修正）","corrections":["F-02「16ファイルにコピーされている」は実測すると script/link の並びが16枚とも一致しており、問題は複製そのものではなく将来のドリフトだった","F-11「ビルド工程が要る」は誤り。Tailwind の実使用は22ユーティリティのみで、静的CSSに置き換えられた","F-04 は潜在リスクではなく実害。survey-detail.html で plan の値が説明文2箇所と選択肢1つを誤置換していた"],"codeChanges":["survey-detail.html: plan を data-slot 化し select と同期、status を全件更新（F-04）","admin.js: themeToggle の import と呼び出しを撤去（F-07）、注入完了の CustomEvent を発火（F-08）","proto-level.js: 100ms×30回のポーリングを admin:chrome-ready 待ちへ置換（F-08）","02_dashboard/invoice-detail.html: ?embed=1 の受け口を追加、管理側の stripChrome を撤去（F-09）","admin-style.css: Tailwind CDN の代替CSSを追加し、16画面から CDN の script 行を削除（F-11）","check_refs.py: 16画面のシェル一致検査を追加（F-02）","escalations.html / reconciliation/list.html: 到達不能である旨の注記（F-10）"]},{"date":"2026-08-06 (3)","summary":"アンケート詳細のカラム構成を要件書の配置順へ揃え、設問構成の変更導線をモック化した","corrections":["操作ログが左カラム（基本設定の下）にあり、要件書 §4.1「基本情報→設問構成→名刺データ化設定→回答状況→要注意操作→操作ログ」の順序と逆だった","設問構成に「会期前のみ変更できます」と書かれているのに変更導線が無く、どう変えるのかがモックから読み取れなかった","モックの設問タイプ4種（単一選択／複数選択／自由記述／名刺アップロード）は正本にない呼称だった。正本は12種で、名刺はそもそも設問タイプではなくアンケート単位の設定（bizcardEnabled）"],"codeChanges":["survey-detail.html: 操作ログを右カラムの要注意操作の下へ移動（左=対象アンケート／右=運営側の道具）","survey-detail.html: 設問構成に編集ボタンと mQuestions モーダルを追加。会期状態で通常編集／要注意操作／変更不可を出し分け、保存で一覧・注記・操作ログへ反映","survey-detail.html: 設問タイプを正本12種（surveyCreation-v2.js の QUESTION_TYPES）へ揃え、選択肢・マトリックス行列・評定尺度の段階数を編集可能にし、設問と選択肢の削除に確認を挟んだ"]},{"date":"2026-08-06 (4)","summary":"設問編集を利用者側のアンケート編集画面と同じ機能構成へそろえた（正本12種・型別の回答設定・複製・途中挿入・型変更の確認）","corrections":["モックの設問タイプ4種（単一選択／複数選択／自由記述／名刺アップロード）は正本にない呼称だった。正本は 02_dashboard/src/surveyCreation-v2.js の QUESTION_TYPES 12種","「名刺アップロード」という設問タイプは存在しない。回答画面でも設問ループとは別の連絡先ブロックで扱われ、アンケート単位の bizcardEnabled / 名刺データ化設定が持つ。設問「お名刺の撮影」ごとモックから削除した（5問→4問）","利用者側と突き合わせた結果、管理画面には型別の回答設定・設問の複製・途中挿入・型変更の警告が無かった（§4.3 の「同一の機能構成」を満たしていなかった）"],"codeChanges":["survey-detail.html: 設問タイプを正本12種へ。選択肢・マトリックスの行列・評定尺度の段階数を編集可能に","survey-detail.html: 設問・選択肢の削除にインライン確認（[削除する / やめる]）を追加","survey-detail.html: 編集UIを利用者側エディタと同じアコーディオン（1問ずつ開閉・閉じたままサマリ表示）へ作り直し","survey-detail.html: 型別の回答設定を追加（フリーアンサー/数値回答/日付時間/手書き/評定尺度）。利用者側の buildXxxSection と同じ項目","survey-detail.html: 設問の複製（⧉）と設問間への挿入（＋ ここに設問を追加）を追加","survey-detail.html: 系統をまたぐ型変更に確認を挟み、同系統では選択肢を引き継ぐようにした"]},{"date":"2026-08-06 (5)","summary":"多言語アンケートに対応した（対応言語の表示と変更、設問文と選択肢の言語別編集、未入力の可視化）","corrections":["利用者側エディタは SUPPORTED_LANGS（ja/en/zh-CN/zh-TW/vi）で設問文と選択肢を言語ごとに入力できるのに、管理画面は日本語1つしか編集できず、どの言語のアンケートかも画面から読めなかった"],"codeChanges":["survey-detail.html: ヘッダーと基本設定に対応言語を表示。追加・第一言語の入れ替え・除外（確認つき）に対応","survey-detail.html: 設問文と選択肢を {ja:…, en:…} で持ち、編集言語タブで切り替えて編集できるようにした","survey-detail.html: 第一言語以外の未入力を一覧・カード・タブ・保存時のトーストで可視化。保存の必須判定は第一言語のみ"]},{"date":"2026-08-06 (6)","summary":"設問構成の編集を要件書 §4.6 の要求どおりにし、同じ機能が2箇所にある状態を解消した","corrections":["要注意操作「公開後のアンケート変更」の「変更する範囲」に「設問の修正（設問編集は別画面・本モック対象外）」と書いてあったが、設問編集は本画面のモーダルで実装済みだった。注記が事実と食い違っていた","会期中の設問変更に実行理由の入力が2箇所（mDangerEdit の rEdit と編集モーダルの qReason）にあり、同じ操作に対して別々のゲートが並んでいた","納期区分が基本情報の編集用 select と見出し帯の「申込プラン」表示の2箇所にあった。要件書では §4.2 の表に無く、§4.4 名刺データ化設定が「確認に限る」項目として所管する","見出し帯が作業ステータス・申込プラン・対応言語・対象ユーザーを繰り返していた。§4.1 は見出しを「アンケート ID とタイトル」の識別情報と定めている","会期が基本情報の入力欄と右カラムのカードの2箇所にあり、§4.5 が求める「直近の回答日時」が無かった","選択肢を空のまま保存でき、一覧が「選択肢 5: / / / /」と表示されていた","admin-style.css の [hidden] がインラインの display:flex に負けており、hidden 属性を付けた要素が常に見えていた。設問編集モーダルの「破棄して閉じる／編集に戻る」が出しっぱなしで操作列が2行になり、日本語のみのアンケートでも編集言語バーが出ていた"],"codeChanges":["surv "F-02","severity":"medium","title":"共通ページシェルが16ファイルに複製されている（現時点では一致）","detail":"ヘッダー・サイドバーは JS 注入で共通化されているが、その外側の骨格（#mobileSidebarOverlay / placeholder / main[data-page-min-lv] / script 3本 / CSS 2本）は16ファイルに複製されている。2026-08-06 に実測したところ、script/link の並びはパス深さを正規化すると16枚すべて一致していた。差は data-page-min-lv（意図的な権限宣言）と、全画面作業モード2枚の main インラインstyle（意図的）だけ。","evidence":"script/link をパス深さ正規化して比較したところ16枚が同一。check_refs.py の check_shell() が同じ検査を行う","impact":"現時点でズレはないが、CDN差し替え・CSP導入・スクリプト追加のたびに16ファイルを同時に直す必要があり、1枚だけ漏れても気付けない","recommendation":"共通化そのものは見送った（CSS/CDN を JS 注入に変えると初回描画にちらつきが出るため）。代わりに docs/architecture/check_refs.py へシェル一致検査を追加し、1枚でも並びが違えば落ちるようにした（2026-08-06）。わざと1画面だけ CDN を戻して検知されることを確認済み。","status":"mitigated-2026-08-06","resolution":"check_refs.py が16画面の script/link の並び・必須要素・サイドバー例外2枚・footer不在を検査する"},{"id":"F-03","severity":"medium","title":"同一機能が画面ごとに重複実装されている","detail":"pDlPick（データDL）が survey-management / survey-detail / reconciliation-index の3画面に、pListCsv（一覧CSV出力）が audit-log / performance-management の2画面に、ほぼ同一内容で別々に定義されている。","evidence":"修正前は pDlPick の同一17行が survey-management.html / survey-detail.html / reconciliation/index.html の3画面に、pListCsv の同一26行が audit-log.html / performance-management.html の2画面にあった（diff で差分0を確認）。現在は 03_admin/src/proto-ui.js:574-596（pListCsv）と 601-617（pDlPick）に1本ずつで、画面側は onclick=\"pDlPick(...)\" と audit-log.html:118-121 / performance-management.html:119-122 のラッパのみ","impact":"CSVの列定義やZIPの扱いを変えるとき、修正漏れが3〜2箇所に分散する","recommendation":"proto-ui.js へ pDlPick / pListCsv を移し、画面側は列定義だけを渡す形にする","status":"resolved-2026-08-06","resolution":"pDlPick（3画面・17行の完全一致）と pListCsv（2画面・26行の本体一致）を proto-ui.js へ集約し、画面側の inline 定義を削除した。呼び出し側の onclick と pAuditCsv / pPerfCsv のラッパはそのまま残したため挙動は変わらない。"},{"id":"F-04","severity":"medium","title":"詳細画面の内容差し替えがテキストノードの文字列置換に依存している","detail":"ユーザー詳細・アンケート詳細・照合個票は、既定IDのダミーで書かれたテンプレートに対し、document.body 配下の全テキストノードを走査して既定値の文字列を対象値へ split/join 置換する。 実害が確認できたのは survey-detail.html の plan で、値「通常」が本文テキストに4回現れ、別プランのアンケートを開くと納期区分 select の選択肢1つと説明文2箇所まで書き換わっていた。","evidence":"user-detail.html:202-216 / survey-detail.html:1494-1517 / reconciliation/detail.html:488-500","impact":"既定値の文字列（例: 会社名『(株)マーケットビジョン』）が本文の別の場所に出てくると巻き込みで置換される。逆に集計値・操作ログ・モーダル本文の数値は置換対象外のため、対象を変えても固定ダミーのまま残り、画面内で整合しない","recommendation":"モックの範囲では現状で足りるが、本番実装では data-slot 方式（既に部分的に併用されている）へ寄せる。少なくとも置換対象の文字列が本文に単独で出現しないことを確認する","status":"resolved-2026-08-06","resolution":"survey-detail.html の置換対象から plan を外し、表示は data-slot=\"plan\"、納期区分は data-slot=\"planSelect\" の option 選択で入れるようにした。同ファイルで data-slot=\"status\" の更新が querySelector（単数）だったため2つあるバッジの片方しか追従していなかったのも querySelectorAll へ直した。user-detail.html と reconciliation/detail.html は置換値がすべて長い固有文字列で誤置換が起きないことを出現回数の計測で確認し、3画面のコメントに「短い一般語は置換対象にしない」規則を明記した。"},{"id":"F-05","severity":"medium","title":"権限制御が表示制御であることの明示は十分だが、実装は3系統に分かれている","detail":"画面単位のガードは proto-level.js（main[data-page-min-lv]）、要素単位は data-min-lv/data-max-lv、そして operator-management.html と calendar-management.html は localStorage を直読みして独自に判定している。","evidence":"修正前は operator-management.html と calendar-management.html が localStorage を直読みしていた（フォールバック規則が3種類）。現在の窓口は 03_admin/src/proto-level.js:24-26（pLevel）で、呼び出しは operator-management.html:242,365 / calendar-management.html:201。画面ガードと要素ガードは同 22-38（applyVisibility）・48-57（applyPage）が担う","impact":"権限まわりの仕様変更時に3箇所を追う必要がある。直読みしている2画面は proto-level.js の既定値ロジック（不正値→lv4）と別実装になっている","recommendation":"proto-level.js に現在レベルを返すAPI（例: window.pLevel()）を1本用意し、直読みを置き換える","status":"resolved-2026-08-06","resolution":"proto-level.js に window.pLevel() を追加し、operator-management.html の2箇所と calendar-management.html の1箇所の localStorage 直読みを置き換えた。未定義値（例: lv9）の解釈が proto-level.js と食い違う問題が解消した。要素単位の data-min-lv / data-max-lv と画面単位の data-page-min-lv は宣言のままで、評価はいずれも proto-level.js が行う。"},{"id":"F-06","severity":"low","title":"footer.html が全画面で無駄に取得されていた","detail":"admin.js は注入先の有無を確認せずに common/footer.html を fetch していた。到達16画面はいずれも #footer-placeholder を持たないため、16画面すべてで取得しては捨てていた。 同じ理由で、サイドバーを持たない作業画面2枚（名刺入力・名刺情報照合）では sidebar.html も取得しては捨てていた。","evidence":"修正前は admin.js が注入先を確認せずに fetch していた。現在は 03_admin/src/admin.js:72-77 で先に確認し、footer の呼び出しは同 207。grep -l 'id=\"footer-placeholder\"' の一致は到達16画面で0件、到達不能な escalations.html / reconciliation/list.html / sample/data_entry_admin_form.html の3枚のみ","impact":"ページあたり1リクエストの無駄。フッターを出す／出さないの意図がコードから読み取れない状態だった","recommendation":"loadCommonHtml() の先頭で注入先を確認し、無ければ取得もしないようにした（2026-08-06）。common/footer.html は #footer-placeholder を持つ到達不能2枚がまだ読み込むため残置し、その旨をファイル先頭に注記した。","status":"resolved-2026-08-06","resolution":"loadCommonHtml() の先頭で注入先を確認するようにした。到達16画面での footer.html 取得と、作業画面2枚での sidebar.html 取得が消えた。注入先を持つ到達不能2枚では従来どおり取得・描画される（ブラウザで確認済み）。"},{"id":"F-07","severity":"info","title":"themeToggle.js を import しているが管理画面に切替UIがなく、適用先もない","detail":"admin.js が 02_dashboard 側の themeToggle.js を import して initThemeToggle() を呼ぶが、管理画面の header.html / sidebar.html に #themeToggle も #sidebarThemeToggle も無い。さらに body.dark-mode はCSS変数（--color-*）を再定義するだけで、管理画面は変数もトークン系クラスも1つも使わず admin-style.css が body{background-color:#F4F6F9} を後勝ちで直指定しているため、theme=dark が保存されていても見た目は変わらない。","evidence":"03_admin/src/admin.js（import と initThemeToggle の呼び出しは 2026-08-06 に撤去） / 02_dashboard/src/lib/themeToggle.js:15-31 / 到達16画面＋common/*.html＋admin-style.css での var(--color- 使用数 = 0 / admin-style.css:23-27","impact":"視覚的な影響はない。未使用の import と初期化呼び出しが残っているだけで、読む側に「管理画面もダーク対応している」と誤解させる","recommendation":"管理画面をダーク対応する場合は admin-style.css 側にダーク定義（現状0件）を用意したうえで切替UIを足す","status":"resolved-2026-08-06","resolution":"admin.js から themeToggle.js の import と initThemeToggle() の呼び出しを外した。視覚的影響がないことは事前に実測済み"},{"id":"F-08","severity":"low","title":"proto-level.js がヘッダー注入を100ms×30回のポーリングで待っている","detail":"ヘッダー・サイドバーが admin.js の非同期 fetch で後から現れるため、proto-level.js は setInterval で最大3秒間、配線を試み続ける。","evidence":"03_admin/src/proto-level.js:92-99","impact":"低速回線では3秒以内に注入されず、表示シナリオのセレクトが配線されないまま残る可能性がある。またレベル切替が location.reload を伴うため体感が重い","recommendation":"admin.js の注入完了を CustomEvent で通知し、proto-level.js はそれを待つ形にする","status":"resolved-2026-08-06","resolution":"admin.js が共通パーツの注入を終えた時点で CustomEvent \"admin:chrome-ready\" を発火し、proto-level.js はそれを受けて配線するようにした。100ms×30回のポーリングは撤去。classic script の proto-level.js は module の admin.js より先に実行されるためリスナー登録は必ず間に合う。DOMContentLoaded 時にも1回だけ試す保険を残した。"},{"id":"F-09","severity":"info","title":"iframe 埋め込みが利用者側のDOM構造に依存している","detail":"請求書管理は 02_dashboard/invoice-detail.html を iframe で読み込み、contentDocument に <style> を注入して #header-placeholder / #sidebar-placeholder / #footer-placeholder / #breadcrumb-container / main > div > header / .invoice-sheet を対象にした表示制御を行う。","evidence":"03_admin/invoice-management.html:86-98","impact":"利用者側のID・クラス・DOM階層が変わるとセレクタが外れ、管理画面のモーダルに利用者用ヘッダーやパンくずがそのまま出る。壊れても例外にならず見た目だけ崩れるため気付きにくい","recommendation":"利用者側に『枠なし表示』のクエリ（例: ?embed=1）を用意し、管理側からのDOM操作をやめる","status":"resolved-2026-08-06","resolution":"利用者側 02_dashboard/invoice-detail.html に ?embed=1 の受け口（インラインscript＋html[data-embed] のCSS）を足し、管理側の stripChrome() を撤去した。iframe の中身へ管理側から手を入れることはなくなった。クエリ無しの表示が変わっていないことは、HEAD 版と現在版を同じファイル名で描画してピクセル比較し差分0で確認済み。"},{"id":"F-10","severity":"info","title":"到達不能な旧画面が2枚残っている","detail":"escalations.html（157行・エスカレーション対応）と reconciliation/list.html（128行・照合一覧）はどこからもリンクされておらず、シェル骨格も旧世代（Material Icons・pt-16・bg-background・#footer-placeholder あり）で現行16画面と揃っていない。","evidence":"grep で両ファイルへの参照が0件","impact":"URL直打ちでしか開けないが、開くと現行と体裁の違う画面が出る。棚卸し対象","recommendation":"残す判断なら現行シェルへ揃えてサイドバーに載せる。残さないなら削除する。なお escalations.html の扱いは docs/admin_本番画面網羅_差分と修正プラン_20260802.md:151 で「削除か凍結資料として残置か」として既に未決論点に挙がっており、docs/リライト版仕様書/admin/19,20 は SCR-A-016 を「検討凍結」と記している。この2枚は #footer-placeholder を持つため、common/footer.html を消すとフッターが落ちる点にも注意。","status":"mitigated-2026-08-06","resolution":"未決論点のため削除も現行シェルへの統一も行わず、両ファイル先頭に「到達不能・検討凍結・別世代の骨格・この2枚だけが #footer-placeholder を持つ」ことを注記した。"},{"id":"F-11","severity":"info","title":"外部CDN依存（Tailwind は撤去済み、フォントは残置）","detail":"到達16画面は cdn.tailwindcss.com（ブラウザ内JIT）と fonts.googleapis.com を実行時に読み込んでいた。実測では Tailwind の使用は22ユーティリティのみ、container-queries は0件、forms の影響は checkbox 5＋radio 10 に限られていた。","evidence":"03_admin/index.html:8,11-12 ほか15画面","impact":"Tailwind が落ちるとレイアウトが崩れ、ブラウザ内JITのため初回描画にちらつきが出ていた。フォントは font-family のフォールバック連鎖があり落ちても破綻しない","recommendation":"Tailwind CDN を admin-style.css 内の静的CSS（preflight 相当のリセット＋22ユーティリティ＋@tailwindcss/forms のベース相当）へ置き換え、到達16画面から script 行を削除した（2026-08-06）。Google Fonts は残置。到達不能な escalations.html / reconciliation/list.html は骨格が別世代のため CDN のまま。","status":"resolved-2026-08-06","resolution":"16画面＋モーダル5種の前後スクリーンショットをピクセル比較しながら、body margin・a の下線・フォーム要素の padding/appearance・select の line-height などの差を1つずつ潰した。差分ピクセルは 1,559,973 から 72,372 まで縮小し、ダッシュボードと営業日カレンダーは完全一致。残差は input[type=datetime-local] がシャドウDOM由来で2px高いことによるもので、アンケート詳細のページ高さが2px変わる（上流の ::-webkit-datetime-edit ルールを入れても Chrome では変化しなかった）。"},{"id":"R-01","severity":"high","title":"請求書管理のページングが件数表示と合っていなかった","detail":"16行すべてが data-pg=\"1\" で、表示件数10を選んでいるのに16行出ていた。件数表示だけ「全16件中1〜5件」と別の数を出し、ページャにも2ページ目が無かった。","evidence":"03_admin/invoice-management.html:54（invoiceList-pager）","impact":"一覧の件数表示が信用できなくなる。他8画面は正しかったため、この画面だけ挙動が違った","recommendation":"10件ずつ2ページへ分けた。tests/e2e/admin-mock/lists.spec.js が9画面すべてで行数・件数表示・ページ数の一致を見る","status":"resolved-2026-08-06"},{"id":"R-02","severity":"medium","title":"オペレーター実績確認の「集計最終更新」が2つ並んでいた","detail":"performance-management.html の32行目と33行目が完全に同一だった。","evidence":"03_admin/performance-management.html:32（集計最終更新）","impact":"同じ情報が重複して出るだけでなく、CSV出力ボタンが右端から押し出されていた","recommendation":"1つにし、残した側へ margin-right:auto を付けた","status":"resolved-2026-08-06"},{"id":"R-03","severity":"high","title":"ユーザー詳細で招待が本登録より後の日時になっていた","detail":"招待メールの日時を「登録日の 10:02」で固定していたため、登録日時が10:02より前のアカウントで時系列が逆転した。U-1002 は招待 10:02 → 本登録完了 08:57 だった。","evidence":"03_admin/user-detail.html:296（inviteAt）","impact":"メール送達状況と操作ログの両方に出るため、運用者が実際の順序を誤解する","recommendation":"inviteAt() で登録日時の前日を返し、送達状況と操作ログが同じ値を使う","status":"resolved-2026-08-06"},{"id":"R-04","severity":"high","title":"実在の名刺画像が公開状態で置かれていた","detail":"dummy_card_front/back.png は名前に反して実物の名刺写真で、氏名・メール・電話・住所が写っていた。表と裏が別人で、照合表の値ともどこも一致していなかった。GitHub Pages が公開設定のため誰でも取得できた。","evidence":"03_admin/reconciliation/detail.html:47（dummy_card_front）","impact":"社外の個人情報がインターネットから取得できる状態だった。照合作業のデモとしても成立していなかった","recommendation":"架空の名刺へ差し替え、照合表が期待する値と一致させた。差し替え前の画像は git の履歴に残るため、履歴からの削除は別途判断が要る","status":"resolved-2026-08-06"},{"id":"R-05","severity":"high","title":"納期区分を指す言葉が6通りある","detail":"ダッシュボード=納期区分 / アンケート管理=申込プラン / アンケート詳細=データ化申込プラン（補足に納期区分）/ ユーザー詳細=データ化の申込 / 請求管理の脚注=プラン / 照合画面=納期。値はどれも 通常・特急・超特急・オンデマンド・お試し で同じ。さらに「プラン」はプレミアム契約の意味でも使われ、ユーザー詳細では1画面に2つの意味の「プラン」が出る。","evidence":"tests/e2e/admin-mock/consistency.spec.js の「R-05 納期区分: 呼び方を1つに絞る」","impact":"運用者が別のものだと思って読む。仕様書と画面の対応も取りづらい","recommendation":"どれを正とするかは事業側の決定。決まれば置換は機械的に行える","status":"deferred-要判断"},{"id":"R-06","severity":"medium","title":"「操作ログ」と「監査ログ」が混在している","detail":"本文中では監査ログ29回・操作ログ12回。画面名は「操作ログ・監査ログ」で両方を名乗り、サイドバーは「操作ログ」だけ。セクション見出しは「操作ログ」なのに説明文は「監査ログに記録されます」。","evidence":"tests/e2e/admin-mock/consistency.spec.js の「R-06 操作ログ: 呼び方を1つに絞る」","impact":"2種類の記録があるのか1つなのかが読み取れない","recommendation":"同じものなら1語に寄せる。別物なら画面上で区別が付くようにする","status":"deferred-要判断"},{"id":"R-07","severity":"medium","title":"サイドバーの項目名と遷移先の画面名が違う","detail":"サイドバー「名刺入力画面」→ 画面名「データ入力対象一覧」、「照合画面」→「照合結果一覧」。ダッシュボードのリンクは画面名側を使っているため、1つの画面に名前が2つある。この2項目だけ「〜画面」で終わっているのも他と揃っていない。","evidence":"tests/e2e/admin-mock/consistency.spec.js の「R-07 サイドバーの項目名と、遷移先の画面名が一致する」","impact":"サイドバーで選んだ先に別の名前が出る。手順書を書くときにどちらを使うか決まらない","recommendation":"どちらかに寄せる。サイドバーは他が「〜管理」「〜確認」なので画面名側に合わせる案が素直","status":"deferred-要判断"},{"id":"R-08","severity":"low","title":"言語名の書き方が2系統ある","detail":"アンケート詳細は 日本語 / English / 中文(简体)、オペレーター管理は 日本語 / 英語 / 中国語簡繁 / 韓国語。同じ言語を別の表記で書いている。","evidence":"03_admin/operator-management.html / 03_admin/survey-detail.html","impact":"対応言語で絞り込むときに一致しない","recommendation":"表示言語（利用者が回答する言語）と対応可能言語（オペレーターが扱える言語）で用途が違うため、揃えるかどうかも含めて判断が要る","status":"deferred-要判断"},{"id":"R-09","severity":"low","title":"会社名の株式会社表記が揃っていない","detail":"(株) が265回、株式会社が57回。前株13社・後株10社。同じ会社が両方の表 /* --- 文字幅を見積もって折り返す（全角1em / 半角0.55em） --- */
function widthEm(s){let w=0;for(const ch of s){w += /[\x00-\x7F]/.test(ch)?0.55:1;}return w;}
function wrap(s,budget,maxLines){
  const out=[]; let cur='',w=0;
  for(const ch of s){
    const cw=/[\x00-\x7F]/.test(ch)?0.55:1;
    if(w+cw>budget && cur){ out.push(cur); cur=''; w=0; if(out.length===maxLines-1) break; }
    cur+=ch; w+=cw;
  }
  if(out.length<maxLines){
    const rest=s.slice(out.join('').length);
    if(widthEm(rest)>budget){
      let acc='',aw=0;
      for(const ch of rest){const cw=/[\x00-\x7F]/.test(ch)?0.55:1; if(aw+cw>budget-0.7)break; acc+=ch; aw+=cw;}
      out.push(acc+'…');
    } else if(rest) out.push(rest);
  }
  return out.length?out:[s];
}

/* --- エッジ --- */
const pairSeen={};
DATA.edges.forEach(e=>{
  const a=N[e.source], b=N[e.target];
  if(!a||!b||a._x===undefined||b._x===undefined) return;
  const key=[e.source,e.target].sort().join('|');
  const idx=(pairSeen[key]=(pairSeen[key]||0)+1)-1;
  const canon=(e.source<e.target)?1:-1;
  e._off=(14+idx*22)*canon;
  const kind=KINDS[e.kind]?e.kind:'load';
  const path=el('path',{class:'edge','data-id':e.id,d:edgePath(a,b,e._off),
    stroke:KINDS[kind].color,'marker-end':'url(#ar-'+kind+')'});
  if(KINDS[kind].dash) path.setAttribute('stroke-dasharray',KINDS[kind].dash);
  gEdge.appendChild(path);
  E.push({def:e,elp:path,kind:kind});
});

function clipTo(n,tx,ty){
  const dx=tx-n._x, dy=ty-n._y;
  if(!dx&&!dy) return {x:n._x,y:n._y};
  const hw=n._w/2+7, hh=n._h/2+7;
  const s=Math.min(dx?hw/Math.abs(dx):Infinity, dy?hh/Math.abs(dy):Infinity);
  return {x:n._x+dx*s, y:n._y+dy*s};
}
function edgePath(a,b,off){
  const mx=(a._x+b._x)/2, my=(a._y+b._y)/2;
  const dx=b._x-a._x, dy=b._y-a._y, len=Math.hypot(dx,dy)||1;
  const cx=mx+(-dy/len)*off, cy=my+(dx/len)*off;
  const p1=clipTo(a,cx,cy), p2=clipTo(b,cx,cy);
  return `M${p1.x.toFixed(1)},${p1.y.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
}

/* ===================== ズーム / パン ===================== */
function applyT(){ vp.setAttribute('transform',`translate(${state.t.x},${state.t.y}) scale(${state.t.k})`); }
function fit(){
  const r=svg.getBoundingClientRect();
  const vis=DATA.nodes.filter(n=>POS[n.id]&&state.layers.has(n.layer));
  if(!vis.length) return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  vis.forEach(n=>{x0=Math.min(x0,n._x-n._w/2);y0=Math.min(y0,n._y-n._h/2);
                  x1=Math.max(x1,n._x+n._w/2);y1=Math.max(y1,n._y+n._h/2);});
  const pad=46, w=x1-x0+pad*2, h=y1-y0+pad*2;
  const k=Math.min(r.width/w, r.height/h, 1.6);
  state.t.k=k;
  state.t.x=(r.width-(x1+x0)*k)/2;
  state.t.y=(r.height-(y1+y0)*k)/2;
  applyT();
}
function zoomAt(f,px,py){
  const r=svg.getBoundingClientRect();
  const cx=(px===undefined)?r.width/2:px-r.left, cy=(py===undefined)?r.height/2:py-r.top;
  const k1=Math.max(.22,Math.min(3.2,state.t.k*f));
  const s=k1/state.t.k;
  state.t.x=cx-(cx-state.t.x)*s; state.t.y=cy-(cy-state.t.y)*s; state.t.k=k1;
  applyT();
}
svg.addEventListener('wheel',ev=>{ev.preventDefault();zoomAt(ev.deltaY<0?1.12:1/1.12,ev.clientX,ev.clientY);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',ev=>{
  if(ev.target.closest('.node')) return;
  drag={x:ev.clientX,y:ev.clientY,tx:state.t.x,ty:state.t.y};
  svg.classList.add('dragging'); svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove',ev=>{
  if(!drag) return;
  state.t.x=drag.tx+(ev.clientX-drag.x); state.t.y=drag.ty+(ev.clientY-drag.y); applyT();
});
['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,()=>{drag=null;svg.classList.remove('dragging');}));
document.getElementById('zIn').onclick=()=>zoomAt(1.25);
document.getElementById('zOut').onclick=()=>zoomAt(1/1.25);
document.getElementById('zFit').onclick=fit;

function focusNode(id,pulse){
  const n=N[id]; if(!n||n._x===undefined) return;
  const r=svg.getBoundingClientRect();
  const k=Math.max(state.t.k,.85);
  state.t.k=k; state.t.x=r.width/2-n._x*k; state.t.y=r.height/2-n._y*k;
  applyT();
  if(pulse&&nodeEls[id]){
    nodeEls[id].classList.add('pulse');
    setTimeout(()=>nodeEls[id]&&nodeEls[id].classList.remove('pulse'),2100);
  }
}

/* ===================== フィルタ・強調 ===================== */
function flowSets(f){
  const ns=new Set(), es=new Set();
  (f.steps||[]).forEach(s=>{ if(s.node) ns.add(s.node); if(s.edge) es.add(s.edge); });
  DATA.edges.forEach(e=>{ if(es.has(e.id)){ ns.add(e.source); ns.add(e.target); } });
  return {ns,es};
}
function neighborSets(id){
  const ns=new Set([id]), es=new Set();
  DATA.edges.forEach(e=>{
    if(e.source===id||e.target===id){ es.add(e.id); ns.add(e.source); ns.add(e.target); }
  });
  return {ns,es};
}
function matches(n,q){
  if(!q) return true;
  const hay=[n.name,n.id,n.description,(n.filePaths||[]).join(' '),(n.technologies||[]).join(' '),
             (n.responsibilities||[]).join(' '),TYPE_JA[n.type]||''].join(' ').toLowerCase();
  return hay.includes(q);
}
function render(){
  const q=state.query.trim().toLowerCase();
  let hi=null;
  if(state.flow) hi=flowSets(state.flow);
  else if(state.node) hi=neighborSets(state.node);

  let hit=0;
  DATA.nodes.forEach(n=>{
    const g=nodeEls[n.id]; if(!g) return;
    const vis=state.layers.has(n.layer);
    g.classList.toggle('hidden',!vis);
    if(!vis) return;
    const m=matches(n,q); if(q&&m) hit++;
    const inHi=hi?hi.ns.has(n.id):true;
    g.classList.toggle('dim', (!!q&&!m) || (!!hi&&!inHi));
    g.classList.toggle('sel', state.node===n.id);
  });
  document.getElementById('qcount').textContent = q ? (hit+' 件一致') : '';

  E.forEach(({def,elp,kind})=>{
    const vis = state.kinds.has(kind) && state.layers.has(N[def.source].layer) && state.layers.has(N[def.target].layer);
    elp.classList.toggle('hidden',!vis);
    if(!vis) return;
    const on = hi ? hi.es.has(def.id) : false;
    const near = hi ? (hi.ns.has(def.source)&&hi.ns.has(def.target)) : true;
    elp.classList.toggle('hi',on);
    elp.classList.toggle('dim', hi ? !(on||near) : false);
    elp.setAttribute('marker-end','url(#ar-'+kind+(on?'-hi':'')+')');
  });
}

/* ===================== チップUI ===================== */
const layerChips=document.getElementById('layerChips');
Object.entries(LAYERS).forEach(([k,v])=>{
  const l=document.createElement('label');
  l.className='chip on'; l.style.color=v.color;
  l.innerHTML=`<span class="dot"></span><span>${v.label}</span>`;
  l.onclick=()=>{
    if(state.layers.has(k)) state.layers.delete(k); else state.layers.add(k);
    l.classList.toggle('on',state.layers.has(k)); l.classList.toggle('off',!state.layers.has(k));
    render();
  };
  layerChips.appendChild(l);
});
const kindChips=document.getElementById('kindChips');
Object.entries(KINDS).forEach(([k,v])=>{
  const on=state.kinds.has(k);
  const l=document.createElement('label');
  l.className='chip '+(on?'on':'off'); l.style.color=v.color;
  l.innerHTML=`<span class="dot"></span><span>${v.label}</span>`;
  l.onclick=()=>{
    if(state.kinds.has(k)) state.kinds.delete(k); else state.kinds.add(k);
    l.classList.toggle('on',state.kinds.has(k)); l.classList.toggle('off',!state.kinds.has(k));
    render();
  };
  kindChips.appendChild(l);
});

/* ===================== ツールチップ ===================== */
const tip=document.getElementById('tip');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function li(arr,max){
  if(!arr||!arr.length) return '<span style="color:var(--ink-3)">—</span>';
  const a=arr.slice(0,max).map(v=>'<li>'+esc(v)+'</li>').join('');
  return '<ul>'+a+(arr.length>max?'<li style="color:var(--ink-3)">ほか'+(arr.length-max)+'件</li>':'')+'</ul>';
}
function showTip(n,ev){
  const c=LAYERS[n.layer].color;
  tip.innerHTML=
    `<div class="tt-h"><span class="tt-n">${esc(n.name)}</span>
      <span class="tt-t" style="color:${c};border:1px solid ${c}">${esc(TYPE_JA[n.type]||n.type)}</span></div>
     <div class="tt-d">${esc(n.description).slice(0,150)}${n.description.length>150?'…':''}</div>
     <dl>
       <dt>責務</dt><dd>${li(n.responsibilities,3)}</dd>
       <dt>使用技術</dt><dd>${esc((n.technologies||[]).join(' / '))||'—'}</dd>
       <dt>入力</dt><dd>${li(n.inputs,2)}</dd>
       <dt>出力</dt><dd>${li(n.outputs,2)}</dd>
     </dl>
     <div class="tt-f">${esc((n.filePaths&&n.filePaths[0])||'（ファイル実体なし）')}${(n.filePaths||[]).length>1?' ほか'+(n.filePaths.length-1)+'ファイル':''} ・ 押下で全文</div>`;
  tip.classList.add('on');
  moveTip(ev);
}
function moveTip(ev){
  const r=tip.getBoundingClientRect();
  let x=ev.clientX+16, y=ev.clientY+16;
  if(x+r.width>innerWidth-8) x=ev.clientX-r.width-16;
  if(y+r.height>innerHeight-8) y=Math.max(8,ev.clientY-r.height-16);
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
gNode.addEventListener('mouseover',ev=>{const g=ev.target.closest('.node'); if(g&&!g.classList.contains('dim')) showTip(N[g.dataset.id],ev);});
gNode.addEventListener('mousemove',ev=>{if(tip.classList.contains('on'))moveTip(ev);});
gNode.addEventListener('mouseout',ev=>{if(!ev.relatedTarget||!ev.relatedTarget.closest('.node'))tip.classList.remove('on');});

/* ===================== パネル ===================== */
const pFlows=document.getElementById('pFlows'), pDetail=document.getElementById('pDetail'), pFindings=document.getElementById('pFindings');
function tab(name){
  document.querySelectorAll('.ptab').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  pFlows.hidden=name!=='flows'; pDetail.hidden=name!=='detail'; pFindings.hidden=name!=='findings';
}
document.querySelectorAll('.ptab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));

/* --- フロー一覧 --- */
function buildFlows(){
  const cats={};
  DATA.flows.forEach(f=>{ (cats[f.category||'その他']=cats[f.category||'その他']||[]).push(f); });
  let html='<p class="pintro">'+esc(DATA.metadata.scope.definition)+
    '<br>フローを選ぶと、経路上のノードと関係だけが図に残ります。手順を押すとその要素へ移動します。</p>';
  let no=0;
  Object.entries(cats).forEach(([cat,fs])=>{
    html+='<div class="fcat">'+esc(cat)+'</div>';
    fs.forEach(f=>{
      no++;
      html+=`<div class="flow" data-flow="${f.id}">
        <button type="button" class="fhead"><span class="fnum">${no}</span>
          <span><span class="fname">${esc(f.name)}</span><span class="fdesc">${esc(f.description)}</span></span></button>
        <div class="fsteps">
          <div class="fmeta">起点: ${esc(f.trigger||'unknown')}</div>
          ${(f.steps||[]).map(s=>`<div class="step" data-node="${esc(s.node||'')}">
              <span class="sn">${s.order}</span>
              <span><span class="stn">${esc(N[s.node]?N[s.node].name:(s.node||'unknown'))}</span>
              <span class="stx"> — ${esc(s.action)}</span>
              <span class="sev">${esc(s.evidence||'')}</span></span></div>`).join('')}
        </div></div>`;
    });
  });
  pFlows.innerHTML=html;
  pFlows.querySelectorAll('.flow').forEach(box=>{
    box.querySelector('.fhead').onclick=()=>{
      const id=box.dataset.flow;
      if(state.flow&&state.flow.id===id){ state.flow=null; box.classList.remove('on'); }
      else{
        state.flow=DATA.flows.find(f=>f.id===id); state.node=null;
        pFlows.querySelectorAll('.flow').forEach(b=>b.classList.remove('on'));
        box.classList.add('on');
        box.scrollIntoView({block:'nearest',behavior:'smooth'});
      }
      render();
    };
    box.querySelectorAll('.step').forEach(st=>{
      st.onclick=()=>{ const id=st.dataset.node; if(id&&N[id]) focusNode(id,true); };
    });
  });
}

/* --- ノード詳細 --- */
function showDetail(id){
  const n=N[id]; if(!n) return;
  const c=LAYERS[n.layer].color;
  const outs=DATA.edges.filter(e=>e.source===id), ins=DATA.edges.filter(e=>e.target===id);
  const sec=(t,b)=>`<div class="dsec"><h4>${t}</h4>${b}</div>`;
  const rows=(arr,dir)=>arr.length?arr.map(e=>{
    const other=N[dir==='out'?e.target:e.source];
    return `<div class="edgerow" data-node="${esc(other?other.id:'')}">
      <span class="dir">${dir==='out'?'→':'←'}</span>
      <span><span class="er-n">${esc(other?other.name:'?')}</span>
      <span class="er-d"><br>${esc(e.relationship)} · ${esc(e.protocol)}<br>${esc(e.description)}</span></span></div>`;
  }).join(''):'<p style="color:var(--ink-3);font-size:11.5px">なし</p>';

  pDetail.innerHTML=
    `<div class="dhead"><h3>${esc(n.name)}</h3>
      <span class="tag" style="color:${c};background:transparent;border:1px solid ${c}">${esc(TYPE_JA[n.type]||n.type)}</span>
      <span class="tag ${n.reachable===false?'no':'ok'}">${n.reachable===false?'到達不能':'到達可能'}</span>
      ${n.minLevel?`<span class="tag ok">Lv${n.minLevel}以上</span>`:''}
      <span class="tag ${n.confidence==='verified'?'ok':'no'}">${esc(n.confidence)}</span></div>
    ${n.url?`<p style="font-size:11.5px;color:var(--ink-3);margin:0 0 10px">${esc(n.url)}</p>`:'<div style="height:6px"></div>'}
    ${sec('役割',`<p>${esc(n.description)}</p>`)}
    ${sec('責務',li(n.responsibilities,20))}
    ${sec('使用技術',(n.technologies||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')||'—')}
    ${sec('入力',li(n.inputs,20))}
    ${sec('出力',li(n.outputs,20))}
    ${sec('ファイル',(n.filePaths||[]).length?(n.filePaths||[]).map(p=>`<code class="path">${esc(p)}</code>`).join(''):'<p style="color:var(--ink-3)">ファイル実体なし</p>')}
    ${n.dataSource?sec('データの持ち方',`<p>${esc(n.dataSource)}</p>`):''}
    ${n.specDoc?sec('対応する要件書',`<code class="path">${esc(n.specDoc)}</code>`):''}
    ${n.risk?sec('留意点',`<p>${esc(n.risk)}</p>`):''}
    ${n.impact?sec('影響',`<p>${esc(n.impact)}</p>`):''}
    ${(n.unknowns||[]).length?sec('unknown（コードから判断できない）',li(n.unknowns,10)):''}
    ${sec('この要素から出る依存 ('+outs.length+')',rows(outs,'out'))}
    ${sec('この要素へ入る依存 ('+ins.length+')',rows(ins,'in'))}
    ${sec('根拠',`<p style="font-size:11px;color:var(--ink-3)">${esc(n.evidence||'unknown')}</p>`)}`;
  pDetail.querySelectorAll('.edgerow').forEach(r=>{
    r.onclick=()=>{const t=r.dataset.node; if(t&&N[t]){selectNode(t);focusNode(t,true);} };
  });
  pDetail.scrollTop=0;
}
function selectNode(id){
  state.node=id; state.flow=null;
  pFlows.querySelectorAll('.flow').forEach(b=>b.classList.remove('on'));
  showDetail(id); tab('detail'); render();
}
gNode.addEventListener('click',ev=>{const g=ev.target.closest('.node'); if(g) selectNode(g.dataset.id);});
gNode.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'||ev.key===' '){const g=ev.target.closest('.node'); if(g){ev.preventDefault();selectNode(g.dataset.id);}}
});

/* --- 発見事項 + 凡例 --- */
function buildFindings(){
  const m=DATA.metadata;
  let html=`<div class="dsec"><h4>概要</h4>
    <p>${esc(m.applicationType)}。バックエンド: ${esc(m.backend)}。ビルド: ${esc(m.buildSystem)}。<br>
    エントリ <code class="path" style="display:inline-block;margin:4px 0 0">${esc(m.entryPoint)}</code></p></div>
    <div class="dsec"><h4>規模</h4><p>
      到達画面 ${m.statistics.reachableScreens} / 共通ランタイム ${m.statistics.sharedRuntimeModules} 本 /
      ノード ${m.statistics.nodes} / 関係 ${m.statistics.edges} / フロー ${m.statistics.flows}<br>
      到達不能JS ${m.statistics.unreachableJsLines.toLocaleString()} 行
    </p></div>
    <div class="dsec"><h4>凡例（ノードの枠色 = レイヤー）</h4><div class="legend">`;
  Object.values(LAYERS).forEach(v=>{ html+=`<div class="lr"><span class="bx" style="border-color:${v.color}"></span>${esc(v.label)}</div>`; });
  html+=`<div class="lr"><span class="bx" style="border-color:var(--l-legacy);border-style:dashed"></span>破線枠 = index.html から到達しない</div></div></div>
    <div class="dsec"><h4>凡例（線の色 = 関係）</h4><div class="legend">`;
  Object.values(KINDS).forEach(v=>{
    html+=`<div class="lr"><span class="sw" style="border-top-color:${v.color};${v.dash?'border-top-style:dashed':''}"></span>${esc(v.label)}</div>`;
  });
  html+='</div></div>';
  (DATA.metadata.revisions||[]).forEach(r=>{
    html+=`<div class="dsec"><h4>改訂 ${esc(r.date)}</h4><div class="rev">
      <p style="margin:0 0 6px;font-size:11.4px;color:var(--ink-2)">${esc(r.summary)}</p>
      ${(r.corrections||[]).length?'<b>訂正</b><ul>'+r.corrections.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>':''}
      ${(r.codeChanges||[]).length?'<b>反映したコード変更</b><ul>'+r.codeChanges.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>':''}
    </div></div>`;
  });
  html+='<div class="dsec"><h4>発見事項</h4>';
  (DATA.findings||[]).forEach(f=>{
    const st=f.status||'';
    const badge = st.startsWith('resolved') ? '<span class="sev-b done">対応済み</span>'
                : st.startsWith('mitigated') ? '<span class="sev-b partial">手当て済み</span>' : '';
    html+=`<div class="finding${st?' closed':''}">
      <h5><span class="sev-b sev-${esc(f.severity)}">${esc(f.severity)}</span>${badge}${esc(f.title)}</h5>
      <p>${esc(f.detail)}</p>
      ${f.resolution?`<p class="res"><b>対応</b>: ${esc(f.resolution)}</p>`:''}
      <div class="fx"><b>影響</b>: ${esc(f.impact)}<br><b>${f.resolution?'補足':'対応案'}</b>: ${esc(f.recommendation)}<br><b>根拠</b>: ${esc(f.evidence)}</div>
    </div>`;
  });
  html+='</div>';
  pFindings.innerHTML=html;
}

/* ===================== 初期化 ===================== */
document.getElementById('brandSub').textContent =
  DATA.metadata.entryUrl+' から到達する範囲 ・ '+DATA.metadata.generatedAt+' 時点';
buildFlows(); buildFindings();
pDetail.innerHTML='<div class="empty">図のノードを押すと、役割・責務・使用技術・入出力・依存関係を表示します。</div>';

const qi=document.getElementById('q');
qi.addEventListener('input',()=>{state.query=qi.value;render();});
document.getElementById('btnClear').onclick=()=>{
  state.flow=null; state.node=null; state.query=''; qi.value='';
  pFlows.querySelectorAll('.flow').forEach(b=>b.classList.remove('on'));
  render();
};
addEventListener('keydown',ev=>{
  if(ev.key==='/'&&document.activeElement!==qi){ev.preventDefault();qi.focus();}
  if(ev.key==='Escape'){document.getElementById('btnClear').click();qi.blur();}
});
addEventListener('resize',()=>{ if(!state.node&&!state.flow) fit(); });

render();
requestAnimationFrame(fit);
</script>
