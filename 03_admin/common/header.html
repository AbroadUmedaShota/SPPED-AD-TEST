
<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-5" style="height:56px;background:var(--a-surface);border-bottom:1px solid var(--a-border)">
    <div class="flex items-center gap-3">
        <button id="mobile-sidebar-toggle" class="lg:hidden p-2 rounded" aria-label="ナビゲーションを開く" style="color:var(--a-fg-strong);font-size:18px;line-height:1">☰</button>
        <a href="index.html" class="flex items-center gap-3" aria-label="管理者ダッシュボードへ" style="text-decoration:none;white-space:nowrap">
            <span style="font-size:17px;font-weight:700;letter-spacing:1.5px;color:var(--a-fg-strong);white-space:nowrap">SPEED <span style="color:var(--a-accent)">AD</span></span>
            <span class="admin-badge" style="font-size:11px;font-weight:700;color:var(--a-accent);border:1px solid var(--a-info-border);border-radius:4px;padding:2px 8px;background:var(--a-info-bg);white-space:nowrap">管理画面</span>
        </a>
    </div>
    <div class="flex items-center" style="gap:14px">
        <label title="モックの見せ分け(実際の認可制御ではない)。" style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--a-fg-muted2);white-space:nowrap"><span class="admin-scenario-label">表示シナリオ</span>
            <select id="levelSelect" style="border:1px solid var(--a-border-strong);border-radius:6px;padding:4px 8px;font-size:12px;font-family:inherit;color:var(--a-fg-strong);min-width:160px;background:var(--a-surface)">
                <option value="lv1">Lv1 Operator</option>
                <option value="lv2">Lv2 OperatorAdmin</option>
                <option value="lv3">Lv3 Admin</option>
                <option value="lv4" selected>Lv4 MasterAdmin</option>
            </select>
        </label>
        <button type="button" id="themeToggle" aria-pressed="false"
            title="表示テーマを切り替えます(ライト / ダーク)"
            style="display:flex;align-items:center;gap:6px;background:var(--a-surface);color:var(--a-fg);border:1px solid var(--a-border-strong);border-radius:6px;padding:5px 12px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap">
            <span id="themeToggleIcon" aria-hidden="true">🌙</span><span id="themeToggleLabel">ダーク</span>
        </button>
        <span class="admin-clock" style="font-size:12px;color:var(--a-fg-muted2);white-space:nowrap">2026/07/31(金) 09:45 JST</span>
    </div>
</header>
